name: Screens

# Runs the app in an emulator with test data and saves a screenshot of every screen
# (pushed to the ci-log branch under shots/). Fails if a screen crashes.
on:
  workflow_dispatch:
  push:
    branches: [native]
    paths: ['app/src/**', '.github/workflows/screens.yml']

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and the test
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon 2>&1 | tail -30
      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.fibrocoir.app.ScreensTest com.fibrocoir.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.log
            mkdir -p shots
            adb exec-out run-as com.fibrocoir.app sh -c 'cd files/shots && tar -c .' > shots.tar || true
            tar -xf shots.tar -C shots || true
            adb logcat -d -t 400 '*:E' > shots/logcat.txt || true
      - name: Publish screenshots
        if: always()
        run: |
          mkdir -p shots; cp instrument.log shots/ 2>/dev/null || true
          ls -la shots
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q --orphan ci-shots-tmp
          git rm -rqf --cached . > /dev/null
          git add -f shots
          git commit -qm "screens ${{ github.run_number }}"
          git push -qf origin HEAD:refs/heads/ci-shots
      - name: Fail on a crash
        run: |
          grep -q "FAILURES\|Process crashed\|INSTRUMENTATION_RESULT: shortMsg" instrument.log && { grep -A30 "FAILURES\|crashed\|shortMsg" instrument.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; } || true
