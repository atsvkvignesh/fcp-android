name: Build APK

on:
  push:
    branches: ['**']   # main publishes a release; other branches only build a test APK
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk FibroCoir.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FibroCoir-v1.0.${{ github.run_number }}
          path: FibroCoir.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fibro Coir v1.0.${{ github.run_number }}
          body: |
            Install: download **FibroCoir.apk** below on your phone and open it.
            Built from ${{ github.sha }}.
          files: FibroCoir.apk
          make_latest: true

      # Test builds from other branches: a pre-release, so the "latest" link workers use doesn't change
      - name: Publish test build
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-v1.0.${{ github.run_number }}
          name: TEST ${{ github.ref_name }} v1.0.${{ github.run_number }}
          body: |
            Test build from branch `${{ github.ref_name }}` (${{ github.sha }}). Not for workers.
            Install: download **FibroCoir.apk** below on your phone and open it.
          files: FibroCoir.apk
          prerelease: true
          make_latest: false
