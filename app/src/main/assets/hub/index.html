<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fibro Coir Products</title>
<link rel="stylesheet" href="../lib/fonts.css">
<link rel="stylesheet" href="../lib/app.css">
<script>window.FCP_PAGE = { app: 'hub' };</script>
<script src="../lib/config.js"></script>
<script src="../lib/fcp.js"></script>
<script src="../lib/gas-shim.js"></script>
<style>
  :root{
    --husk:#1C1408;
    --husk-2:#2A1F10;
    --husk-3:#352716;
    --fibre:#E2A93B;
    --fibre-hi:#FFD25E;
    --cream:#F6EEDC;
    --muted:#B6A184;
    --edge:rgba(226,169,59,.24);
    --bad:#E8734A;
    --good:#8FBF6A;
    --r:14px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}   /* class rules beat the browser default, so force it */
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, #3A2A14 0%, rgba(58,42,20,0) 60%),
      var(--husk);
    color:var(--cream);
    font-family:Archivo,"Segoe UI",system-ui,sans-serif;
    font-size:16px;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  /* coir strands, very faint */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.055;
    background:repeating-linear-gradient(24deg,#E2A93B 0 1px,transparent 1px 7px),
               repeating-linear-gradient(-61deg,#E2A93B 0 1px,transparent 1px 11px);
  }
  .wrap{position:relative;max-width:780px;margin:0 auto;padding:22px 18px 56px}

  .mark{display:flex;flex-direction:column;align-items:center;gap:10px;margin:14px 0 26px}
  .mark img{width:150px;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  .mark h1{
    font-family:Fraunces,Georgia,serif;font-weight:700;font-size:26px;line-height:1.1;
    margin:0;letter-spacing:.2px;text-align:center;color:var(--cream);
  }
  .mark p{margin:0;color:var(--muted);font-size:13.5px;letter-spacing:.9px}

  /* ---------- sign in ---------- */
  .sheet{
    background:linear-gradient(180deg,var(--husk-2),#241A0C);
    border:1px solid var(--edge);border-radius:18px;padding:20px 18px;
    box-shadow:0 18px 40px -24px #000;
  }
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;letter-spacing:.3px}
  input,select{
    width:100%;padding:13px 14px;font:inherit;font-size:16px;color:var(--cream);
    background:#171003;border:1px solid #4A3618;border-radius:11px;outline:none;
  }
  input:focus,select:focus{border-color:var(--fibre);box-shadow:0 0 0 3px rgba(226,169,59,.18)}
  .field{margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1 1 150px;min-width:0}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:48px;padding:12px 18px;font:inherit;font-weight:600;font-size:15.5px;
    color:#22180A;background:linear-gradient(180deg,#F2C255,#DA9C2C);
    border:none;border-radius:11px;cursor:pointer;
  }
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--edge)}
  .btn.small{min-height:40px;padding:8px 13px;font-size:14px;border-radius:9px}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(232,115,74,.45)}
  .btn[disabled]{opacity:.55;cursor:default}
  :focus-visible{outline:2px solid var(--fibre);outline-offset:2px}

  /* ---------- hub ---------- */
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .bar img{width:52px;height:auto}
  .bar .who{flex:1;min-width:0}
  .bar .who b{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;display:block}
  .bar .who span{color:var(--muted);font-size:13px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .tile{
    position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;
    min-height:124px;padding:15px 16px;text-decoration:none;color:var(--cream);
    background:linear-gradient(150deg,var(--husk-3),#221809);
    border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;
  }
  .tile::after{
    content:"";position:absolute;inset:0;opacity:.1;
    background:repeating-linear-gradient(28deg,#F2C255 0 1px,transparent 1px 6px);
  }
  .tile:active{transform:scale(.988)}
  .tile .ico{
    position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    font-size:20px;background:#1A1205;border:1px solid var(--edge);
  }
  .tile .nm{position:relative;font-weight:600;font-size:17px;line-height:1.25}
  .tile .go{position:relative;color:var(--muted);font-size:12.5px}
  .tile.add{border-style:dashed;background:transparent;justify-content:center;align-items:center;color:var(--muted)}

  .foot{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}

  /* ---------- manage ---------- */
  h2{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:20px;margin:26px 0 12px}
  .card{background:var(--husk-2);border:1px solid var(--edge);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .card .ttl{font-weight:600;margin-bottom:10px;word-break:break-word}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
    border:1px solid var(--edge);color:var(--fibre);margin-left:6px;vertical-align:2px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .access{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 2px}
  .access button{min-height:38px;padding:7px 13px;font:inherit;font-size:14px;color:var(--cream);
    background:#1A1205;border:1px solid var(--edge);border-radius:999px;cursor:pointer}
  .access button[aria-pressed="true"]{background:var(--fibre);color:#22180A;border-color:var(--fibre);font-weight:600}
  .access button.all[aria-pressed="true"]{background:#8FBF6A;border-color:#8FBF6A}
  .hint{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.5}
  .empty{color:var(--muted);font-size:14px;padding:6px 0 10px}

  .modal{position:fixed;inset:0;z-index:30;background:rgba(8,5,1,.74);display:flex;
    align-items:center;justify-content:center;padding:20px}
  .modal .box{width:100%;max-width:340px;background:linear-gradient(180deg,var(--husk-2),#241A0C);
    border:1px solid var(--edge);border-radius:16px;padding:18px;box-shadow:0 24px 60px -20px #000}
  .modal h3{margin:0 0 8px;font-family:Fraunces,Georgia,serif;font-size:18px}
  .modal p{margin:0 0 4px;color:var(--muted);font-size:13.5px;line-height:1.5}
  .modal input{margin-top:10px}
  .modal .mb{display:flex;gap:10px;margin-top:16px}
  .modal .mb .btn{flex:1}
  #toast{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;
    max-width:92vw;padding:12px 16px;border-radius:11px;font-size:14.5px;
    background:#100B02;border:1px solid var(--edge);box-shadow:0 10px 30px -12px #000;display:none;
  }
  #toast.bad{border-color:rgba(232,115,74,.6);color:#FFD9CB}
  .busy{opacity:.5;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- plumbing ---------- */
var TOKEN = null, ST = { me:null, links:[], users:[], allLinks:[] };
var DRAFT = {};   // user id -> chosen app ids while editing, or 'all'
var $ = function(id){ return document.getElementById(id); };

function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(res, rej){
    google.script.run
      .withSuccessHandler(res)
      .withFailureHandler(function(e){ rej(e && e.message ? e.message : String(e)); })
      [fn].apply(null, args);
  });
}
function say(msg, bad){
  var t = $('toast');
  t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(say._t); say._t = setTimeout(function(){ t.style.display = 'none'; }, bad ? 4800 : 2600);
}
function busy(on){ $('wrap').className = on ? 'wrap busy' : 'wrap'; }

/* Chrome blocks alert/confirm/prompt inside Apps Script's cross-origin
   iframe, so every dialog is drawn in the page instead. */
function modal(cfg){
  return new Promise(function(res, rej){
    var back = document.createElement('div'); back.className = 'modal';
    var box  = document.createElement('div'); box.className = 'box';
    var h    = document.createElement('h3'); h.textContent = cfg.title || '';
    box.appendChild(h);
    if (cfg.text){ var p = document.createElement('p'); p.textContent = cfg.text; box.appendChild(p); }
    var inp = null;
    if (cfg.input){
      inp = document.createElement('input');
      inp.type = (cfg.input === 'password') ? 'password' : 'text';
      inp.autocapitalize = 'none';
      if (cfg.value) inp.value = cfg.value;
      if (cfg.placeholder) inp.placeholder = cfg.placeholder;
      box.appendChild(inp);
    }
    var row = document.createElement('div'); row.className = 'mb';
    var ok  = document.createElement('button'); ok.className = 'btn';        ok.textContent = cfg.ok || 'OK';
    var cx  = document.createElement('button'); cx.className = 'btn ghost';  cx.textContent = cfg.cancel || 'Cancel';
    row.appendChild(ok); row.appendChild(cx); box.appendChild(row);
    back.appendChild(box); document.body.appendChild(back);

    function close(v){
      if (back.parentNode) document.body.removeChild(back);
      if (v === null) rej('cancel'); else res(v);
    }
    ok.onclick = function(){ close(inp ? inp.value : true); };
    cx.onclick = function(){ close(null); };
    back.addEventListener('click', function(e){ if (e.target === back) close(null); });
    back.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); ok.click(); }
      if (e.key === 'Escape') cx.click();
    });
    setTimeout(function(){ (inp || ok).focus(); }, 40);
  });
}
function askYes(title, text, okLabel){ return modal({ title:title, text:text, ok:okLabel || 'Yes' }); }

function show(view){
  if (view === 'manageView' && (!ST.me || ST.me.role !== 'admin')) view = 'hubView';
  ['loginView','hubView','manageView'].forEach(function(v){
    var el = $(v); if (el) el.hidden = (v !== view);
  });
  window.scrollTo(0,0);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function keep(t){ TOKEN = t; try{ localStorage.setItem('fcp_token', t); }catch(e){} }
function drop(){ TOKEN = null; try{ localStorage.removeItem('fcp_token'); }catch(e){} }

/* ---------- render ---------- */
function apply(state){
  ST = state;
  if (!Array.isArray(ST.links)) ST.links = [];
  if (!Array.isArray(ST.allLinks)) ST.allLinks = ST.links;
  if (!Array.isArray(ST.users)) ST.users = [];
  $('whoName').textContent = state.me.name;
  $('whoRole').textContent = state.me.role === 'admin' ? 'Admin' : 'Data entry';

  var isAdmin = (state.me.role === 'admin');
  $('manageBtn').hidden = !isAdmin;
  $('myPwBtn').hidden   = !isAdmin;
  if (!isAdmin){
    // take the whole admin screen out of the page, not just out of sight
    var mv = $('manageView');
    if (mv && mv.parentNode) mv.parentNode.removeChild(mv);
  }
  drawTiles(); drawLinks(); drawUsers(); probeTools();
}
function host(url){ try{ return url.split('/')[2].replace(/^www\./,''); }catch(e){ return 'link'; } }
function initials(n){ return n.trim().charAt(0).toUpperCase(); }

function drawTiles(){
  var box = $('tiles'), html = '';
  if (!ST.links.length){
    html += '<p class="empty">No apps yet.' + (ST.me.role === 'admin' ? ' Add the first one from Manage.' : ' Ask the office to add one.') + '</p>';
  }
  ST.links.forEach(function(l){
    html += '<a class="tile" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
              '<span class="ico">' + (l.icon ? esc(l.icon) : esc(initials(l.name))) + '</span>' +
              '<span><span class="nm">' + esc(l.name) + '</span><br>' +
              '<span class="go">Opens ' + esc(host(l.url)) + '</span></span></a>';
  });
  if (ST.me.role === 'admin'){
    html += '<button class="tile add" id="addTile">+ Add an app</button>';
  }
  box.innerHTML = html;
  if ($('addTile')) $('addTile').onclick = function(){ show('manageView'); };
  markTiles();
}

/* ---------- tools with a built-in screen in the app ---------- */
var TOOLS_KEY = 'fcp:tools';
function toolMap(){ try{ return JSON.parse(localStorage.getItem(TOOLS_KEY) || '{}') || {}; }catch(e){ return {}; } }
function saveToolMap(m){ try{ localStorage.setItem(TOOLS_KEY, JSON.stringify(m)); }catch(e){} }
function isScript(url){ return /^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\//.test(url || ''); }
function builtIn(url){
  var k = toolMap()[url];
  return !!(k && k.app && window.FCPApp && FCPApp.hasLocal && FCPApp.hasLocal(k.app)) ? k.app : '';
}
/** Ask each tool's script once in a while whether it has Api.gs (and so a built-in screen). */
function probeTools(){
  var m = toolMap(), now = Date.now();
  (ST.links || []).forEach(function(l){
    if (!isScript(l.url)) return;
    var k = m[l.url];
    if (k && now - k.at < (k.app ? 24 : 0.5) * 3600 * 1000) return;   // yes: re-check daily; no: every 30 min
    FCP.client({ url: l.url, key: FCP_CONFIG.key, app: 'probe', timeout: 30000 }).call('__app', []).then(function(d){
      var mm = toolMap(); mm[l.url] = { app: (d && d.app) || '', at: Date.now() }; saveToolMap(mm); markTiles();
    }, function(err){
      if (err.offline) return;                       // no signal: ask again next time
      var mm = toolMap(); mm[l.url] = { app: '', at: Date.now() }; saveToolMap(mm); markTiles();
    });
  });
}
function markTiles(){
  Array.prototype.forEach.call(document.querySelectorAll('#tiles a.tile'), function(a){
    var go = a.querySelector('.go'); if (!go) return;
    if (builtIn(a.getAttribute('href'))) go.textContent = 'Opens in the app';
  });
}
function openTile(url){
  if (!window.FCPApp) return false;                 // a normal browser: plain link
  var app = builtIn(url);
  if (app){ FCPApp.openLocal(app + '?api=' + encodeURIComponent(url)); return true; }
  if (isScript(url) && FCPApp.openUrl){ FCPApp.openUrl(url); return true; }
  return false;                                      // Google Forms etc. open outside the app
}
$('tiles').addEventListener('click', function(e){
  var a = e.target.closest('a.tile'); if (!a) return;
  if (openTile(a.getAttribute('href'))) e.preventDefault();
});

function drawLinks(){
  if (ST.me.role !== 'admin' || !$('linkList')) return;
  var box = $('linkList'), html = '';
  ST.links.forEach(function(l, i){
    html += '<div class="card" data-id="' + l.id + '">' +
      '<div class="ttl">' + esc(l.name) + '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Button name</label><input class="eName" value="' + esc(l.name) + '"></div>' +
        '<div class="field" style="flex:0 0 110px"><label>Icon</label><input class="eIcon" maxlength="3" value="' + esc(l.icon || '') + '"></div>' +
      '</div>' +
      '<div class="field"><label>Link</label><input class="eUrl" autocapitalize="none" spellcheck="false" value="' + esc(l.url) + '"></div>' +
      '<div class="acts">' +
        '<button class="btn small" data-act="save">Save changes</button>' +
        '<button class="btn ghost small" data-act="up"' + (i === 0 ? ' disabled' : '') + '>Move up</button>' +
        '<button class="btn ghost small" data-act="down"' + (i === ST.links.length - 1 ? ' disabled' : '') + '>Move down</button>' +
        '<button class="btn danger small" data-act="del">Remove</button>' +
      '</div></div>';
  });
  box.innerHTML = html || '<p class="empty">No apps on the hub yet.</p>';
}

/** What this user is allowed right now: 'all' or an array of app ids. */
function accessOf(u){
  if (DRAFT[u.id] !== undefined) return DRAFT[u.id];
  if (u.allApps || !Array.isArray(u.apps)) return 'all';
  return u.apps.slice();
}

function accessPicker(u){
  if (u.role === 'admin'){
    return '<div class="hint" style="margin:2px 0 0">Admins can open every app.</div>';
  }
  var chosen = accessOf(u);
  var all = (chosen === 'all');
  var html = '<label>Apps this person can open</label><div class="access">' +
    '<button class="all" data-app="__all" aria-pressed="' + all + '">All apps</button>';
  (ST.allLinks || []).forEach(function(l){
    var on = !all && chosen.indexOf(l.id) > -1;
    html += '<button data-app="' + l.id + '" aria-pressed="' + on + '">' +
            (l.icon ? esc(l.icon) + ' ' : '') + esc(l.name) + '</button>';
  });
  html += '</div>';
  if (!all && !chosen.length){
    html += '<div class="hint" style="margin:4px 0 0;color:var(--bad)">No apps chosen — they will sign in to an empty hub.</div>';
  }
  return html;
}

function drawUsers(){
  if (ST.me.role !== 'admin' || !ST.users || !$('userList')) return;
  var box = $('userList'), html = '';
  ST.users.forEach(function(u){
    html += '<div class="card" data-uid="' + u.id + '">' +
      '<div class="ttl">' + esc(u.name) +
        '<span class="pill">' + (u.role === 'admin' ? 'Admin' : 'Data entry') + '</span></div>' +
      '<div class="hint" style="margin:0 0 10px">Signs in as <b>' + esc(u.login) + '</b></div>' +
      accessPicker(u) +
      '<div class="row" style="margin-top:12px">' +
        '<div class="field"><label>New password</label><input class="uPw" type="text" placeholder="Leave blank to keep"></div>' +
      '</div>' +
      '<div class="acts">' +
        (u.role === 'admin' ? '' : '<button class="btn small" data-uact="apps">Save app access</button>') +
        '<button class="btn ghost small" data-uact="pw">Set password</button>' +
        (u.id === ST.me.id ? '' : '<button class="btn danger small" data-uact="del">Remove person</button>') +
      '</div></div>';
  });
  box.innerHTML = html;
}

/* ---------- actions ---------- */
function remember(state){
  var copy = {}; Object.keys(state).forEach(function(k){ if (k !== 'token') copy[k] = state[k]; });
  FCP.save('app_state', [TOKEN], copy);
}
function run(promise){
  busy(true);
  return promise.then(function(state){ busy(false); apply(state); remember(state); return state; })
                .catch(function(err){ busy(false); say(err, true); throw err; });
}

$('loginBtn').onclick = function(){
  var u = $('lu').value.trim(), p = $('lp').value;
  if (!u || !p){ say('Enter your user name and password.', true); return; }
  busy(true);
  call('app_login', u, p).then(function(state){
    busy(false); keep(state.token); apply(state); show('hubView');
    FCP.forget(); remember(state);
    $('lp').value = ''; say('Welcome, ' + state.me.name + '.');
  }).catch(function(err){ busy(false); say(err, true); });
};
$('lp').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('loginBtn').click(); });
$('lu').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('lp').focus(); });

$('outBtn').onclick = function(){
  var t = TOKEN; drop(); show('loginView'); say('Signed out.');
  FCP.forget();
  if (t) call('app_logout', t).catch(function(){});
};
$('manageBtn').onclick = function(){ show('manageView'); };
$('backBtn').onclick = function(){ show('hubView'); };

$('myPwBtn').onclick = function(){
  modal({ title:'Change your password', text:'Start with the password you use now.',
          input:'password', ok:'Next' })
    .then(function(oldPw){
      return modal({ title:'New password', text:'Six characters or more.', input:'password', ok:'Save' })
        .then(function(newPw){ return run(call('api_changeMyPassword', TOKEN, oldPw, newPw)); });
    })
    .then(function(){ say('Password changed.'); })
    .catch(function(){});
};

if ($('addLinkBtn')) $('addLinkBtn').onclick = function(){
  run(call('api_addLink', TOKEN, $('nlName').value, $('nlUrl').value, $('nlIcon').value))
    .then(function(){ $('nlName').value = ''; $('nlUrl').value = ''; $('nlIcon').value = ''; say('App added.'); });
};

if ($('linkList')) $('linkList').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-act]'); if (!btn) return;
  var card = btn.closest('.card'), id = card.getAttribute('data-id');
  var act = btn.getAttribute('data-act');
  if (act === 'save'){
    run(call('api_saveLink', TOKEN, id,
      card.querySelector('.eName').value, card.querySelector('.eUrl').value,
      card.querySelector('.eIcon').value)).then(function(){ say('Saved.'); });
  } else if (act === 'del'){
    askYes('Remove this app?', card.querySelector('.eName').value + ' will disappear from the hub for everyone.', 'Remove')
      .then(function(){ return run(call('api_deleteLink', TOKEN, id)); })
      .then(function(){ say('Removed.'); })
      .catch(function(){});
  } else {
    run(call('api_moveLink', TOKEN, id, act === 'up' ? -1 : 1));
  }
});

if ($('addUserBtn')) $('addUserBtn').onclick = function(){
  run(call('api_addUser', TOKEN, $('nuLogin').value, $('nuName').value, $('nuPw').value, $('nuRole').value))
    .then(function(){ $('nuLogin').value = ''; $('nuName').value = ''; $('nuPw').value = ''; say('Person added.'); });
};

if ($('userList')) $('userList').addEventListener('click', function(e){
  var chip = e.target.closest('button[data-app]');
  if (chip){
    var card0 = chip.closest('.card'), uid = card0.getAttribute('data-uid');
    var user = null; ST.users.forEach(function(x){ if (x.id === uid) user = x; });
    if (!user) return;
    var cur = accessOf(user);
    var app = chip.getAttribute('data-app');
    if (app === '__all'){
      cur = (cur === 'all') ? [] : 'all';
    } else {
      if (cur === 'all') cur = (ST.allLinks || []).map(function(l){ return l.id; });
      var at = cur.indexOf(app);
      if (at > -1) cur.splice(at, 1); else cur.push(app);
    }
    DRAFT[uid] = cur;
    drawUsers();
    return;
  }

  var btn = e.target.closest('button[data-uact]'); if (!btn) return;
  var card = btn.closest('.card'), id = card.getAttribute('data-uid');
  var act = btn.getAttribute('data-uact');

  if (act === 'apps'){
    var pick = DRAFT[id];
    if (pick === undefined){ say('Nothing changed.'); return; }
    run(call('api_setUserApps', TOKEN, id, pick === 'all' ? null : pick))
      .then(function(){ delete DRAFT[id]; say('App access saved.'); });
    return;
  }

  if (act === 'pw'){
    var pw = card.querySelector('.uPw').value;
    if (!pw){ say('Type the new password first.', true); return; }
    run(call('api_setPassword', TOKEN, id, pw)).then(function(){ say('Password set.'); });
    return;
  }
  {
    askYes('Remove this person?', 'They will not be able to sign in any more.', 'Remove')
      .then(function(){ return run(call('api_deleteUser', TOKEN, id)); })
      .then(function(){ say('Person removed.'); })
      .catch(function(){});
  }
});

window.onAppBack = function(){
  var m = document.querySelector('.modal');
  if (m){ var b = m.querySelector('.btn.ghost'); if (b) b.click(); else m.parentNode.removeChild(m); return true; }
  var mv = $('manageView');
  if (mv && !mv.hidden){ show('hubView'); return true; }
  return false;
};

/* ---------- start ---------- */
(function(){
  var saved = null;
  try{ saved = localStorage.getItem('fcp_token'); }catch(e){}
  if (!saved){ checkHub(); show('loginView'); return; }
  TOKEN = saved;
  var shown = false; busy(true);
  FCP.cached('app_state', [saved], function(state){
    if (!shown){ shown = true; busy(false); show('hubView'); }
    apply(state);
  }).then(function(){ if (!shown) busy(false); }, function(e){
    if (!shown) busy(false);
    var msg = e && e.message || '';
    if (/web page|Not allowed/.test(msg)) return webHub();
    if (/Session ended|Sign in again/i.test(msg)){ drop(); FCP.forget(); FCP.note(null); show('loginView'); say('Please sign in again.', true); return; }
    if (!shown){ show('loginView'); say(e.offline ? 'No internet connection.' : msg, true); }
  });
})();

/* The hub script has no Api.gs yet (or an old one): use the Apps Script hub page instead. */
function webHub(){ if (window.FCPApp) location.replace(FCP_CONFIG.hubUrl); }
function checkHub(){
  FCP.client({ url: FCP_CONFIG.hubUrl, key: FCP_CONFIG.key, app: 'probe' }).call('__app', [])
    .catch(function(e){ if (!e.offline) webHub(); });
}
</script>
</body>
