<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCP EC Log</title>
<link rel="stylesheet" href="../lib/fonts.css">
<link rel="stylesheet" href="../lib/app.css">
<script>window.FCP_PAGE = { app: 'ec-log' };</script>
<script src="../lib/config.js"></script>
<script src="../lib/fcp.js"></script>
<script src="../lib/gas-shim.js"></script>
<style>
  :root{
    --husk:#1C1408; --husk-2:#2A1F10; --husk-3:#352716;
    --fibre:#E2A93B; --cream:#F6EEDC; --muted:#B6A184;
    --edge:rgba(226,169,59,.24); --bad:#E8734A; --good:#8FBF6A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;color:var(--cream);font-family:Archivo,"Segoe UI",system-ui,sans-serif;font-size:16px;
    background:radial-gradient(120% 80% at 50% -10%,#3A2A14 0%,rgba(58,42,20,0) 60%),var(--husk);
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
    background:repeating-linear-gradient(24deg,#E2A93B 0 1px,transparent 1px 7px),
               repeating-linear-gradient(-61deg,#E2A93B 0 1px,transparent 1px 11px)}
  .wrap{position:relative;max-width:820px;margin:0 auto;padding:18px 16px 60px}

  .bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .bar img{width:56px;height:auto}
  .bar .who{flex:1;min-width:0}
  .bar .who b{font-family:Fraunces,Georgia,serif;font-size:18px;display:block;line-height:1.2}
  .bar .who span{color:var(--muted);font-size:13px}

  .sheet{background:linear-gradient(180deg,var(--husk-2),#241A0C);border:1px solid var(--edge);
    border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 7px;letter-spacing:.3px}
  input{width:100%;padding:14px;font:inherit;font-size:17px;color:var(--cream);background:#171003;
    border:1px solid #4A3618;border-radius:11px;outline:none}
  input:focus{border-color:var(--fibre);box-shadow:0 0 0 3px rgba(226,169,59,.18)}
  .field{margin-bottom:14px}
  .two{display:flex;gap:12px}.two>*{flex:1;min-width:0}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;
    padding:12px 18px;font:inherit;font-weight:600;font-size:16px;color:#22180A;
    background:linear-gradient(180deg,#F2C255,#DA9C2C);border:none;border-radius:12px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--edge)}
  .btn.small{min-height:40px;padding:8px 13px;font-size:14px;border-radius:9px}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(232,115,74,.45)}
  .btn.wide{width:100%}
  .btn[disabled]{opacity:.5;cursor:default}
  :focus-visible{outline:2px solid var(--fibre);outline-offset:2px}

  .pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .pick button{min-height:74px;font:inherit;font-weight:600;font-size:17px;color:var(--cream);
    background:linear-gradient(150deg,var(--husk-3),#221809);border:1px solid var(--edge);
    border-radius:13px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
  .pick button small{color:var(--muted);font-size:11.5px;font-weight:400}
  .pick button[aria-pressed="true"]{background:linear-gradient(180deg,#F2C255,#DA9C2C);color:#22180A;border-color:#F2C255}
  .pick button[aria-pressed="true"] small{color:#5A3F12}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chips button{min-height:42px;padding:8px 14px;font:inherit;font-size:15px;color:var(--cream);
    background:#1A1205;border:1px solid var(--edge);border-radius:999px;cursor:pointer}
  .chips button[aria-pressed="true"]{background:var(--fibre);color:#22180A;border-color:var(--fibre);font-weight:600}

  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0 0 12px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--good)}
  .dot.wait{background:var(--fibre)}
  .dot.off{background:var(--bad)}

  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th,td{padding:9px 8px;text-align:left;border-bottom:1px solid rgba(226,169,59,.14);white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12.5px}
  td.ec{font-weight:600}
  tr.over td.ec{color:#FFB9A3}
  tr.pending{opacity:.6}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  h2{font-family:Fraunces,Georgia,serif;font-size:19px;margin:22px 0 10px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.5}
  .foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .chartbox{background:var(--husk-2);border:1px solid var(--edge);border-radius:14px;padding:12px;margin-bottom:12px}
  .chartbox{position:relative}
  .chartbox h3{margin:2px 0 8px;font-family:Fraunces,Georgia,serif;font-size:16px}
  .tip{position:absolute;pointer-events:none;z-index:4;padding:7px 10px;border-radius:9px;
    background:#120C03;border:1px solid var(--fibre);font-size:13px;line-height:1.45;
    white-space:nowrap;opacity:0;transition:opacity .08s}
  .tip b{color:var(--fibre);font-weight:600}
  .chartbox svg{touch-action:pan-y}
  svg{width:100%;height:auto;display:block}
  .modal{position:fixed;inset:0;z-index:30;background:rgba(8,5,1,.74);display:flex;
    align-items:center;justify-content:center;padding:20px}
  .modal .box{width:100%;max-width:340px;background:linear-gradient(180deg,var(--husk-2),#241A0C);
    border:1px solid var(--edge);border-radius:16px;padding:18px;box-shadow:0 24px 60px -20px #000}
  .modal h3{margin:0 0 8px;font-family:Fraunces,Georgia,serif;font-size:18px}
  .modal p{margin:0 0 4px;color:var(--muted);font-size:13.5px;line-height:1.5}
  .modal input{margin-top:10px}
  .modal .mb{display:flex;gap:10px;margin-top:16px}
  .modal .mb .btn{flex:1}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;max-width:92vw;
    padding:12px 16px;border-radius:11px;font-size:14.5px;background:#100B02;border:1px solid var(--edge);
    box-shadow:0 10px 30px -12px #000;display:none}
  #toast.bad{border-color:rgba(232,115,74,.6);color:#FFD9CB}
  .busy{opacity:.55;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    var ok  = document.createElement('button'); ok.className = 'btn';        ok.textContent = cfg.ok || 'OK';
    var cx  = document.createElement('button'); cx.className = 'btn ghost';  cx.textContent = cfg.cancel || 'Cancel';
    row.appendChild(ok); row.appendChild(cx); box.appendChild(row);
    back.appendChild(box); document.body.appendChild(back);

    function close(v){
      if (back.parentNode) document.body.removeChild(back);
      if (v === null) rej('cancel'); else res(v);
    }
    ok.onclick = function(){ close(inp ? inp.value : true); };
    cx.onclick = function(){ close(null); };
    back.addEventListener('click', function(e){ if (e.target === back) close(null); });
    back.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); ok.click(); }
      if (e.key === 'Escape') cx.click();
    });
    setTimeout(function(){ (inp || ok).focus(); }, 40);
  });
}
function askYes(title, text, okLabel){ return modal({ title:title, text:text, ok:okLabel || 'Yes' }); }

function show(v){ ['opView','logView','chartView'].forEach(function(x){ $(x).hidden = (x!==v); }); window.scrollTo(0,0); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function loadQueue(){ try{ QUEUE = JSON.parse(get('ec_queue')||'[]'); }catch(e){ QUEUE=[]; } }
function saveQueue(){ set('ec_queue', JSON.stringify(QUEUE)); }

/* ---------- status ---------- */
function status(){
  var d=$('dot'), t=$('statusText');
  if (QUEUE.length){ d.className='dot wait'; t.textContent = QUEUE.length + ' reading' + (QUEUE.length>1?'s':'') + ' waiting to send'; $('syncBtn').hidden=false; }
  else if (!navigator.onLine){ d.className='dot off'; t.textContent='No connection — readings will be held on this tablet'; $('syncBtn').hidden=true; }
  else { d.className='dot'; t.textContent='Saving straight to the sheet'; $('syncBtn').hidden=true; }
}

/* ---------- render ---------- */
function paint(){
  $('opLabel').textContent = OP;
  $('dayLabel').textContent = ST.date;
  var body = $('tbl').getElementsByTagName('tbody')[0], html='';
  var visible = ST.rows.filter(function(r){ return !CLEARED || !r.tsMs || r.tsMs > CLEARED; });
  var hidden = ST.rows.length - visible.length;
  var all = visible.slice().reverse();
  QUEUE.forEach(function(q){ all.unshift({ts:q.timeText, sno:q.sno, point:q.point, spot:q.spot, ec:q.ec, op:q.operator, pending:true}); });
  all.forEach(function(r){
    var lim = ST.limits[r.point] != null ? ST.limits[r.point] : ST.limits.Yard;
    html += '<tr class="' + (r.pending?'pending':'') + (r.ec>lim?' over':'') + '">' +
      '<td>' + esc(String(r.ts).split(' ')[1] || r.ts) + '</td>' +
      '<td>' + esc(r.sno) + '</td><td>' + esc(r.point) + '</td><td>' + esc(r.spot) + '</td>' +
      '<td>' + esc(r.cond || '') + '</td>' +
      '<td class="ec">' + Number(r.ec).toFixed(2) + '</td><td>' + esc(r.op) + '</td>' +
      '<td>' + (r.pending ? '<span style="color:var(--muted);font-size:12px">waiting</span>'
                          : (UNLOCKED
                              ? '<button class="btn ghost small" data-edit="' + r.row + '">Edit</button> ' +
                                '<button class="btn danger small" data-row="' + r.row + '" data-sno="' + esc(r.sno) + '">Remove</button>'
                              : '<button class="btn ghost small" data-edit="' + r.row + '">Edit</button>')) +
      '</td></tr>';
  });
  body.innerHTML = html;
  var n = visible.length;
  $('countLine').textContent = n
    ? (n + ' reading' + (n>1?'s':'') + ' in the sheet' + (QUEUE.length ? ', ' + QUEUE.length + ' waiting' : '') +
       (hidden ? ' · ' + hidden + ' older one' + (hidden>1?'s':'') + ' cleared from this list, still in the sheet' : ''))
    : (hidden ? 'List cleared. The ' + hidden + ' earlier reading' + (hidden>1?'s are':' is') + ' still in the sheet.' : 'No readings yet.');
  $('showAllBtn').hidden = !hidden;
  status();
}

function chips(){
  var list = YARD_SPOTS.slice();
  if (SPOT && SPOT !== '__new' && list.indexOf(SPOT) < 0) list.push(SPOT);
  var html = '';
  list.forEach(function(s){
    html += '<button data-spot="' + esc(s) + '" aria-pressed="' + (SPOT===s) + '">' + esc(s) + '</button>';
  });
  html += '<button data-spot="__new" aria-pressed="' + (SPOT==='__new') + '">Other</button>';
  $('spotChips').innerHTML = html;

  var conds = CONDITIONS.slice();
  if (COND && COND !== '__new' && conds.indexOf(COND) < 0) conds.push(COND);
  var html2 = '';
  conds.forEach(function(c){
    html2 += '<button data-cond="' + esc(c) + '" aria-pressed="' + (COND===c) + '">' + esc(c) + '</button>';
  });
  html2 += '<button data-cond="__new" aria-pressed="' + (COND==='__new') + '">Other</button>';
  $('condChips').innerHTML = html2;
}

$('condChips').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  COND = b.getAttribute('data-cond');
  Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
    x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  $('condNewWrap').hidden = (COND !== '__new');
  if (COND === '__new') $('condNew').focus();
});

/* ---------- charts (drawn from today's rows) ---------- */
function svgChart(title, series, limits){
  var W=640,H=260,L=44,R=12,T=14,B=42;
  var xs=[]; series.forEach(function(s){ s.pts.forEach(function(p){ if(xs.indexOf(p.x)<0) xs.push(p.x); }); });
  if(!xs.length) return '';
  // order the axis by sample number, not by the order the points arrived
  if (xs.every(function(x){ return isFinite(parseFloat(x)); })){
    xs.sort(function(a,b){ return parseFloat(a) - parseFloat(b); });
  }
  var maxY = 0;
  limits.forEach(function(l){ if(l.v>maxY) maxY=l.v; });
  series.forEach(function(s){ s.pts.forEach(function(p){ if(p.y>maxY) maxY=p.y; }); });
  maxY = maxY*1.18 || 1;
  var px=function(i){ return L + (xs.length<2 ? (W-L-R)/2 : i*(W-L-R)/(xs.length-1)); };
  var py=function(v){ return T + (H-T-B) * (1 - v/maxY); };
  var out = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+'">';
  for(var g=0; g<=4; g++){
    var v = maxY*g/4, y = py(v);
    out += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(226,169,59,.16)"/>' +
           '<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" fill="#B6A184" font-size="11">'+v.toFixed(2)+'</text>';
  }
  var step = Math.max(1, Math.ceil(xs.length/8));
  xs.forEach(function(x,i){ if(i%step) return;
    out += '<text x="'+px(i)+'" y="'+(H-B+18)+'" text-anchor="middle" fill="#B6A184" font-size="11">'+esc(x)+'</text>'; });
  var lineCols=['#F2C255','#8FBF6A','#7FB6D9'];
  limits.forEach(function(l,li){
    var y=py(l.v);
    out += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="'+lineCols[li%3]+'" stroke-width="1.5" stroke-dasharray="6 5" opacity=".85"/>' +
           '<text x="'+(W-R)+'" y="'+(y-5)+'" text-anchor="end" fill="'+lineCols[li%3]+'" font-size="11">'+esc(l.name)+' limit '+l.v.toFixed(2)+'</text>';
  });
  var colors=lineCols;
  out += '<line id="guide" x1="0" y1="'+T+'" x2="0" y2="'+(H-B)+'" stroke="var(--fibre)" stroke-width="1" opacity="0"/>';
  series.forEach(function(s,si){
    var d='', open=false, dots='';
    xs.forEach(function(x,i){
      var hit=null; s.pts.forEach(function(p){ if(p.x===x) hit=p; });
      if(!hit){ open=false; return; }
      d += (open?' L ':' M ') + px(i) + ' ' + py(hit.y); open=true;
      dots += '<circle cx="'+px(i)+'" cy="'+py(hit.y)+'" r="4.5" fill="'+colors[si%3]+'"' +
              ' data-i="'+i+'" data-name="'+esc(s.name)+'" data-sno="'+esc(x)+'" data-val="'+hit.y.toFixed(2)+'"/>';
    });
    out += '<path d="'+d+'" fill="none" stroke="'+colors[si%3]+'" stroke-width="2"/>' + dots;
    out += '<circle cx="'+(L+14+si*112)+'" cy="'+(H-10)+'" r="4" fill="'+colors[si%3]+'"/>' +
           '<text x="'+(L+24+si*112)+'" y="'+(H-6)+'" fill="#F6EEDC" font-size="12">'+esc(s.name)+'</text>';
  });
  return out + '</svg>';
}

/* Touch and mouse read-out: finds the nearest sample and shows every series
   at it. SVG <title> tooltips never appear on a tablet, so this replaces them. */
function wireTips(box){
  Array.prototype.forEach.call(box.querySelectorAll('.chartbox'), function(card){
    var svg = card.querySelector('svg'); if (!svg) return;
    var tip = document.createElement('div'); tip.className = 'tip'; card.appendChild(tip);
    var dots = Array.prototype.slice.call(svg.querySelectorAll('circle[data-sno]'));
    var guide = svg.querySelector('#guide');
    if (!dots.length) return;

    function at(clientX, clientY){
      var box2 = svg.getBoundingClientRect();
      var vb = svg.viewBox.baseVal;
      var x = (clientX - box2.left) / box2.width * vb.width;
      var best = null, bestD = 1e9;
      dots.forEach(function(c){
        var d = Math.abs(Number(c.getAttribute('cx')) - x);
        if (d < bestD){ bestD = d; best = c; }
      });
      if (!best || bestD > 60) return hide();
      var i = best.getAttribute('data-i');
      var group = dots.filter(function(c){ return c.getAttribute('data-i') === i; });
      var lines = '<b>Sample ' + best.getAttribute('data-sno') + '</b>';
      group.forEach(function(c){
        lines += '<br>' + c.getAttribute('data-name') + ' · ' + c.getAttribute('data-val');
      });
      tip.innerHTML = lines;
      tip.style.opacity = 1;
      var cx = Number(best.getAttribute('cx')) / vb.width * box2.width;
      var cy = Number(best.getAttribute('cy')) / vb.height * box2.height;
      var top = svg.offsetTop + cy - tip.offsetHeight - 14;
      tip.style.top = Math.max(0, top) + 'px';
      tip.style.left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), card.clientWidth - tip.offsetWidth) + 'px';
      dots.forEach(function(c){ c.setAttribute('r', group.indexOf(c) > -1 ? '6.5' : '4.5'); });
      if (guide){ guide.setAttribute('x1', best.getAttribute('cx'));
                  guide.setAttribute('x2', best.getAttribute('cx'));
                  guide.setAttribute('opacity', '.5'); }
    }
    function hide(){
      tip.style.opacity = 0;
      dots.forEach(function(c){ c.setAttribute('r', '4.5'); });
      if (guide) guide.setAttribute('opacity', '0');
    }
    svg.addEventListener('pointerdown', function(e){ at(e.clientX, e.clientY); });
    svg.addEventListener('pointermove', function(e){ if (e.pointerType === 'mouse' || e.buttons) at(e.clientX, e.clientY); });
    svg.addEventListener('pointerleave', hide);
    svg.addEventListener('pointerup', function(){ setTimeout(hide, 2500); });
  });
}

function drawCharts(){
  $('chartDay').textContent = ST.date + ' · tap a line to read a sample';
  var box = $('charts'), html = '';
  var belt = ST.rows.filter(function(r){ return r.point==='Belt'; }).map(function(r){ return {x:r.sno,y:r.ec}; });
  var block= ST.rows.filter(function(r){ return r.point==='Block'; }).map(function(r){ return {x:r.sno,y:r.ec}; });
  if (belt.length || block.length){
    html += '<div class="chartbox"><h3>Belt and Block</h3>' +
      svgChart('Belt and Block', [{name:'Belt',pts:belt},{name:'Block',pts:block}],
               [{name:'Belt',v:ST.limits.Belt},{name:'Block',v:ST.limits.Block}]) + '</div>';
  }
  var spots = [];
  ST.rows.forEach(function(r){ if(r.point==='Yard' && spots.indexOf(r.spot)<0) spots.push(r.spot); });
  spots.forEach(function(s){
    var pts = ST.rows.filter(function(r){ return r.point==='Yard' && r.spot===s; }).map(function(r){ return {x:r.sno,y:r.ec}; });
    html += '<div class="chartbox"><h3>Yard — ' + esc(s) + '</h3>' +
            svgChart('Yard ' + s, [{name:s,pts:pts}], [{name:'Yard',v:ST.limits.Yard}]) + '</div>';
  });
  box.innerHTML = html || '<p class="sub">Nothing to chart yet today.</p>';
  wireTips(box);
}

/* ---------- actions ---------- */
function paintLock(){
  var b = $('lockBtn');
  b.className = UNLOCKED ? 'btn small' : 'btn ghost small';
  b.textContent = UNLOCKED ? '🔓 Unlocked' : '🔒 Locked';
  b.title = UNLOCKED ? 'Tap to lock' : 'Tap to unlock with the Head QC password';
}
function lock(quiet){
  UNLOCKED = false; cancelEdit(); paintLock(); paint();
  if (!quiet) say('Locked.');
}
function unlock(){ UNLOCKED = true; TOUCHED = Date.now(); paintLock(); paint(); }

/** Resolves once the Head QC password has been given. */
function needUnlock(what){
  TOUCHED = Date.now();
  if (UNLOCKED) return Promise.resolve(true);
  return modal({ title:'Head QC password', text:what || 'Head QC only.',
                 input:'password', ok:'Unlock' })
    .then(function(pin){
      if (String(pin) !== ADMIN_PIN){ say('Wrong password.', true); return Promise.reject('cancel'); }
      unlock(); say('Unlocked. Tap the lock button when you are done.');
      return true;
    });
}
$('lockBtn').onclick = function(){
  if (UNLOCKED){ lock(); return; }
  needUnlock('Unlocks edit, remove, clear and charts.').catch(function(){});
};
setInterval(function(){
  if (UNLOCKED && TOUCHED && Date.now() - TOUCHED > AUTO_LOCK_MIN * 60000){
    lock(true); say('Locked itself after ' + AUTO_LOCK_MIN + ' quiet minutes.');
  }
}, 30000);

function boot(){
  var shown = false; busy(true);
  return FCP.cached('api_boot', [OP], function(s){
    if (!shown){ shown = true; busy(false); }
    ST = s; chips(); paint();
  }, { slot: 'boot' }).then(function(){ if (!shown) busy(false); }, function(e){
    if (!shown) busy(false);
    if (!e.hadSaved && !e.stale) say(e.message, true);
  });
}

function flush(){
  if (!QUEUE.length) return Promise.resolve();
  var next = QUEUE[0];
  return call('api_add', next).then(function(res){
    QUEUE.shift(); saveQueue(); ST.date = res.date; ST.rows = res.rows; paint();
    return QUEUE.length ? flush() : null;
  }).catch(function(e){ status(); throw e; });
}

$('opChips').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  $('opName').value = b.getAttribute('data-op');
});
$('opGo').onclick = function(){
  var n = $('opName').value.trim();
  if (n.length < 2){ say('Type your name first.', true); return; }
  OP = n; set('ec_op', n); show('logView'); paint(); boot();
};
$('switchOp').onclick = function(){
  function go(){ lock(true); show('opView'); $('opName').value = OP; }
  if (QUEUE.length){
    askYes('Change who is entering?',
      QUEUE.length + ' reading(s) are still waiting to reach the sheet.', 'Change anyway')
      .then(go).catch(function(){});
    return;
  }
  go();
};

$('pointPick').addEventListener('click', function(e){
  var b = e.target.closest('button[data-point]'); if(!b) return;
  POINT = b.getAttribute('data-point');
  Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
    x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  $('spotWrap').hidden = (POINT !== 'Yard');
  if (POINT === 'Yard') chips();
});

$('spotChips').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  SPOT = b.getAttribute('data-spot');
  Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
    x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  $('spotNewWrap').hidden = (SPOT !== '__new');
  if (SPOT === '__new') $('spotNew').focus();
});

function startEdit(rowNo){
  var r = null;
  ST.rows.forEach(function(x){ if (x.row === Number(rowNo)) r = x; });
  if (!r){ say('That reading is gone. Refresh the list.', true); return; }
  EDIT = { row:r.row, sno:r.sno };
  POINT = r.point;
  SPOT  = (r.point === 'Yard') ? r.spot : '';
  Array.prototype.forEach.call($('pointPick').querySelectorAll('button'), function(b){
    b.setAttribute('aria-pressed', b.getAttribute('data-point') === POINT ? 'true' : 'false'); });
  $('spotWrap').hidden = (POINT !== 'Yard');
  COND = (r.point === 'Yard') ? (r.cond || '') : '';
  if (POINT === 'Yard') chips();
  $('spotNewWrap').hidden = true; $('condNewWrap').hidden = true;
  $('sno').value = r.sno;
  $('ec').value  = r.ec;
  $('editNote').hidden = false;
  $('editNote').textContent = 'Fixing sample ' + r.sno + ' taken at ' + (String(r.ts).split(' ')[1] || r.ts);
  $('saveBtn').textContent = 'Save changes';
  $('cancelBtn').hidden = false;
  window.scrollTo(0,0);
}
function cancelEdit(){
  if (!EDIT) return;
  EDIT = null;
  $('editNote').hidden = true;
  $('cancelBtn').hidden = true;
  $('saveBtn').textContent = 'Save reading';
  $('sno').value = ''; $('ec').value = '';
}
$('cancelBtn').onclick = cancelEdit;

$('clearBtn').onclick = function(){
  needUnlock('Needed to clear the list.').then(function(){
    if (QUEUE.length){ say('Send the waiting readings first.', true); return; }
    return askYes('Clear the list?',
      'This only clears what you see on this tablet. Every row stays in the Google Sheet.',
      'Clear list').then(function(){
        CLEARED = Date.now(); set('ec_cleared', String(CLEARED));
        cancelEdit(); paint(); say('List cleared. The sheet still has everything.');
      });
  }).catch(function(){});
};
$('showAllBtn').onclick = function(){ CLEARED = 0; set('ec_cleared', '0'); paint(); };

$('saveBtn').onclick = function(){
  if (!POINT){ say('Pick Belt, Block or Yard.', true); return; }
  var spot = POINT === 'Yard' ? (SPOT === '__new' ? $('spotNew').value.trim() : SPOT) : POINT;
  if (POINT === 'Yard' && (!spot || spot === '__new')){ say('Pick or name the yard spot.', true); return; }
  var cond = '';
  if (POINT === 'Yard'){
    cond = (COND === '__new') ? $('condNew').value.trim() : COND;
    if (!cond || cond === '__new'){ say('Pick the material condition.', true); return; }
  }
  var sno = $('sno').value.trim(), ec = parseFloat($('ec').value);
  if (!sno){ say('Enter the sample no.', true); return; }
  if (!isFinite(ec)){ say('Enter the EC value.', true); return; }

  var now = new Date();
  var entry = { operator:OP, point:POINT, spot:spot, cond:cond, sno:sno, ec:ec, clientTs:String(now.getTime()),
                timeText: ('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+':'+('0'+now.getSeconds()).slice(-2) };

  $('saveBtn').disabled = true; $('saveBtn').textContent = 'Saving…';

  if (EDIT){
    call('api_update', '', ST.date, OP, EDIT.row, EDIT.sno, { point:POINT, spot:spot, cond:cond, sno:sno, ec:ec })
      .then(function(res){ ST.rows = res.rows; if (res.limits) ST.limits = res.limits;
                           cancelEdit(); paint(); say('Reading corrected.'); })
      .catch(function(err){ say(err, true); $('saveBtn').textContent = 'Save changes'; })
      .then(function(){ $('saveBtn').disabled = false; });
    return;
  }

  call('api_add', entry).then(function(res){
    ST.date = res.date; ST.rows = res.rows;
    if (res.limits) ST.limits = res.limits;
    if (POINT === 'Yard' && ST.spots.indexOf(spot) < 0){ ST.spots.unshift(spot); SPOT = spot; chips(); $('spotNewWrap').hidden = true; }
    $('sno').value = ''; $('ec').value = ''; $('sno').focus();
    paint(); say('Saved to the sheet.');
  }).catch(function(err){
    QUEUE.push(entry); saveQueue();
    $('sno').value = ''; $('ec').value = ''; paint();
    say('Held on this tablet — no connection. It will go up when signal is back.', true);
  }).then(function(){
    $('saveBtn').disabled = false; $('saveBtn').textContent = 'Save reading';
  });
};

$('tbl').addEventListener('click', function(e){
  var ed = e.target.closest('button[data-edit]');
  if (ed){
    needUnlock('Needed to fix a reading.')
      .then(function(){ startEdit(ed.getAttribute('data-edit')); })
      .catch(function(){});
    return;
  }
  var b = e.target.closest('button[data-row]'); if(!b) return;
  var row = b.getAttribute('data-row'), sno = b.getAttribute('data-sno');
  needUnlock('Needed to delete a reading.').then(function(){
    return askYes('Remove sample ' + sno + '?', 'This deletes the row from the Google Sheet.', 'Remove')
      .then(function(){
        busy(true);
        return call('api_remove', '', ST.date, OP, Number(row), sno)
          .then(function(res){ busy(false); ST.rows = res.rows; if (res.limits) ST.limits = res.limits;
                               paint(); say('Removed.'); })
          .catch(function(e){ busy(false); say(e, true); });
      });
  }).catch(function(){});
});

$('chartBtn').onclick = function(){
  needUnlock('Needed to see the charts.').then(function(){ drawCharts(); show('chartView'); }).catch(function(){});
};
$('chartBack').onclick = function(){ show('logView'); };
$('sheetBtn').onclick = function(){
  needUnlock('Needed to open the sheet.').then(function(){ window.open(ST.sheetUrl, '_blank'); }).catch(function(){});
};
$('refreshBtn').onclick = function(){
  boot().then(function(){
    say('Up to date. Limits: belt ' + ST.limits.Belt + ', block ' + ST.limits.Block + ', yard ' + ST.limits.Yard + '.');
  });
};
$('syncBtn').onclick = function(){
  busy(true);
  flush().then(function(){ busy(false); say('All readings sent.'); })
         .catch(function(){ busy(false); say('Still no connection. They are safe on the tablet.', true); });
};

window.addEventListener('online', function(){ status(); flush().catch(function(){}); });
window.addEventListener('offline', status);

/* ---------- start ---------- */
(function(){
  loadQueue();
  paintLock();
  CLEARED = Number(get('ec_cleared') || 0) || 0;
  var saved = get('ec_op');
  var first = true;
  FCP.cached('api_boot', [saved || ''], function(s){
    ST = s; chips();
    var html = '';
    (ST.operators || []).forEach(function(o){ html += '<button data-op="' + esc(o) + '">' + esc(o) + '</button>'; });
    $('opChips').innerHTML = html;
    if (!first){ paint(); return; }          // fresh copy: just repaint, don't move the person around
    first = false;
    if (saved){ OP = saved; show('logView'); paint(); flush().catch(function(){}); }
    else { show('opView'); }
  }, { slot: 'boot' }).catch(function(e){
    if (!first) return;                       // the saved copy is on screen; the note says it is old
    first = false;
    say('Cannot reach the sheet: ' + e.message, true);
    if (saved){ OP = saved; show('logView'); paint(); } else { show('opView'); }
  });
})();
