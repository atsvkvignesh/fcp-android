<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCP Water Record</title>
<link rel="stylesheet" href="../lib/fonts.css">
<link rel="stylesheet" href="../lib/app.css">
<script>window.FCP_PAGE = { app: 'water-load' };</script>
<script src="../lib/config.js"></script>
<script src="../lib/fcp.js"></script>
<script src="../lib/gas-shim.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCP Water Record</title>
<style>
:root{--bg1:#061a33;--bg2:#0d3b66;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--ink:#eaf6ff;--muted:#9fc3e0;--aqua:#4fd1ff;--aqua2:#1e88e5;--sun:#ffd166;--mint:#5cf2b0;--coral:#ff9b7a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:var(--bg1);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(170deg,var(--bg1),var(--bg2) 60%,#0f4c81)}
#bubbles span{position:fixed;bottom:-50px;border-radius:50%;background:rgba(79,209,255,.12);border:1px solid rgba(79,209,255,.25);animation:rise linear infinite;pointer-events:none;z-index:0}
@keyframes rise{to{transform:translateY(-120vh) translateX(24px)}}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px}

/* header */
header{display:flex;align-items:center;gap:10px}
.logo{font-size:32px;white-space:nowrap;flex-shrink:0;cursor:pointer;animation:bob 2.4s ease-in-out infinite;user-select:none}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
h1{margin:0;font-size:24px;line-height:1.05;font-weight:800;letter-spacing:.5px}
h1 b{color:var(--aqua)}
.sub{color:var(--muted);font-size:13px;min-height:18px;transition:opacity .4s}
.spacer{flex:1}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:6px 12px;font:inherit;font-size:16px;cursor:pointer;transition:transform .1s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.92)}
.btn:disabled{opacity:.3;cursor:default}
.updated{font-size:12px;color:var(--muted);text-align:right;margin:6px 2px 0}
.spin{animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

h2{font-size:18px;margin:22px 4px 10px;font-weight:800}
h2 small{font-weight:600;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(6px)}

/* where is the tanker */
.where{display:grid;gap:12px}
.tk{position:relative;overflow:hidden;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.tk .nm{font-weight:800;font-size:20px;line-height:1.1}
.tk .pl{font-size:12px;color:var(--muted)}
.state{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:99px;font-weight:800;font-size:15px;letter-spacing:.5px}
.state.in{background:rgba(79,209,255,.2);color:var(--aqua)}
.state.out{background:rgba(255,209,102,.18);color:var(--sun)}
.state.park{background:rgba(255,255,255,.1);color:#cfe0ee}
.state.huh{background:rgba(255,155,122,.18);color:var(--coral)}
.timer{font-size:38px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tk.in .timer{color:var(--aqua)}
.tk.out .timer{color:var(--sun)}
.tk .meta{font-size:13px;color:var(--muted)}
.tk .quip{font-size:13px;margin-top:2px}
.tk.in{border-color:rgba(79,209,255,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,209,255,.5)}70%{box-shadow:0 0 0 14px rgba(79,209,255,0)}100%{box-shadow:0 0 0 0 rgba(79,209,255,0)}}
.road{grid-column:1/-1;height:34px;border-bottom:3px dashed rgba(255,255,255,.22);position:relative;overflow:hidden;margin-top:-4px}
.road .truck{position:absolute;bottom:2px;font-size:28px;animation:drive 6s linear infinite}
.road .truck span{display:inline-block;transform:scaleX(-1)}
@keyframes drive{from{left:-40px}to{left:100%}}
.road.park .truck{animation:none;left:12px}
.road .dust{position:absolute;bottom:4px;font-size:14px;opacity:.6;animation:drive 6s linear infinite;animation-delay:-.25s}
.mini{width:96px;height:110px;display:block}
.mini .lvl{animation:fillup 6s ease-in-out infinite}
@keyframes fillup{0%{transform:translateY(80px)}85%{transform:translateY(8px)}100%{transform:translateY(8px)}}
.mini .wv{animation:wave 2s linear infinite}
@keyframes wave{to{transform:translateX(-40px)}}
.bigicon{font-size:64px;text-align:center;line-height:1}
.bigicon.zzz{animation:bob 3s ease-in-out infinite}

/* date bar */
.datebar{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.datebar input{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:6px 10px;font:inherit;font-size:16px;color-scheme:dark}
.daylabel{text-align:center;font-weight:800;font-size:20px;margin-top:6px}

/* summary */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{text-align:center;padding:14px 8px}
.tile .e{font-size:28px}
.tile .v{font-size:30px;font-weight:800;line-height:1.1}
.tile .k{font-size:12px;color:var(--muted)}
.tile.loads .v{font-size:46px;color:var(--aqua)}
.pop{animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.best{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.best b{color:var(--ink)}

/* trips */
.trips{display:flex;flex-direction:column;gap:8px}
.trip{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:12px 14px}
.num{width:44px;height:44px;border-radius:50%;background:linear-gradient(var(--aqua),var(--aqua2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#06223f}
.trip .tt{font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{padding:2px 10px;border-radius:99px;font-weight:700;font-size:13px;white-space:nowrap}
.chip.fill{background:rgba(79,209,255,.18);color:var(--aqua)}
.chip.back{background:rgba(255,209,102,.16);color:var(--sun)}
.chip.first{background:rgba(255,255,255,.08);color:var(--muted)}
.trip .q{font-size:12px;color:var(--muted);margin-top:3px}
.trip.now{border-color:rgba(79,209,255,.7)}
.trip.now .num{background:transparent;border:2px dashed var(--aqua);color:var(--aqua);font-size:22px}
.trip.test{opacity:.45;padding:6px 14px}
.trip.test .num{background:rgba(255,255,255,.15);color:var(--ink);font-size:16px;width:32px;height:32px;margin-left:6px}
.empty{text-align:center;color:var(--muted);padding:26px}
.empty .e{font-size:50px}

footer{text-align:center;color:var(--muted);font-size:12px;margin:26px 0 10px}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-140px);background:#fff;color:#0b2545;padding:10px 18px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:50;transition:transform .5s cubic-bezier(.3,1.5,.5,1);max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.drop{position:fixed;font-size:26px;pointer-events:none;z-index:45;animation:drop 1.3s ease-out forwards}
@keyframes drop{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.loading{text-align:center;padding:70px 10px;font-size:20px}
.loading .e{font-size:56px;display:inline-block;animation:vroom 1.2s ease-in-out infinite alternate}
@keyframes vroom{from{transform:translateX(-30px) scaleX(-1)}to{transform:translateX(30px) scaleX(-1)}}
.err{background:rgba(255,155,122,.14);border-color:rgba(255,155,122,.5);text-align:center}
.wiggle{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@media(max-width:420px){.tile .v{font-size:24px}.tile.loads .v{font-size:40px}.timer{font-size:32px}}
</style>
</head>
<body>
<div id="bubbles"></div>
<div class="toast" id="toast"></div>

<div class="wrap">
  <header>
    <div class="logo" id="logo" title="poke me">🚚💦</div>
    <div>
      <h1>FCP <b>WATER</b> RECORD</h1>
      <div class="sub" id="sub">Warming up the pipes…</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="refreshBtn" title="Refresh now">🔄</button>
  </header>
  <div class="updated" id="updated"></div>

  <div id="app"><div class="loading"><span class="e">🚚</span><div>Fetching the tanker…</div></div></div>

  <footer>Read-only view of the <i>Water Load</i> sheet · updates every 5 minutes 🛟</footer>
</div>

<script>
/* ================= config ================= */
var REFRESH_MS = 5 * 60 * 1000;   // fetch new data every 5 minutes
var TEST_TAP_MIN = 1;             // IN→OUT shorter than this = test tap, not counted
var NEW_DAY_GAP_H = 6;            // gap longer than this isn't a "comeback" (overnight etc.)
var PARKED_MIN = 180;             // inside longer than this = parked (e.g. overnight), not a fill time
                                  // a load is counted on the day the tanker LEAVES (OUT tap)

/* ================= state ================= */
var $ = function (s) { return document.querySelector(s); };
var HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var S = { data: null, trips: [], tankers: [], date: null, lastLoad: 0, nextLoad: 0, loading: false,
          newestOut: 0, newestIn: 0, qi: 0, lastCount: null };
var TZ = Intl.DateTimeFormat().resolvedOptions().timeZone, F = {};
setTZ(TZ);

function setTZ(tz) {
  try { new Intl.DateTimeFormat('en-CA', { timeZone: tz }); TZ = tz; } catch (e) {}
  F.day  = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  F.time = new Intl.DateTimeFormat('en-IN', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true });
  F.hour = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', hourCycle: 'h23' });
}

/* ================= helpers ================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function dayKey(t) {
  var p = {}; F.day.formatToParts(new Date(t)).forEach(function (x) { p[x.type] = x.value; });
  return p.year + '-' + p.month + '-' + p.day;
}
function today() { return dayKey(Date.now()); }
function shiftDay(key, n) { var d = new Date(key + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function niceDate(key) {
  if (key === today()) return 'Today';
  if (key === shiftDay(today(), -1)) return 'Yesterday';
  return new Date(key + 'T00:00:00Z').toLocaleDateString('en-IN', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtT(t) { return F.time.format(new Date(t)); }
function fmtDur(mins) {
  var s = Math.max(0, Math.round(mins * 60)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  if (h) return h + 'h ' + m + 'm';
  if (m) return m + 'm ' + (r < 10 ? '0' : '') + r + 's';
  return r + 's';
}
function fmtClock(ms) {
  var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  var p = function (x) { return (x < 10 ? '0' : '') + x; };
  return h ? h + ':' + p(m) + ':' + p(r) : p(m) + ':' + p(r);
}
function fmtAgo(ms) {
  var m = Math.floor(ms / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm ago';
  var d = Math.floor(h / 24);
  return d + (d === 1 ? ' day' : ' days') + ' ago';
}
function pick(arr, seed) { return arr[Math.abs(Math.floor(seed / 1000)) % arr.length]; }
function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : 0; }

/* ================= fun copy ================= */
var SUBS = [
  'Where\'s the tanker? We always know. 🕵️',
  'Every load, every minute, every drop. 💧',
  'Powered by an ESP32 and pure vibes. ⚡',
  'Hydration station: fully operational. 🫡',
  'Coco peat is thirsty. We keep score. 🌱',
  'No tanker left behind. 🚚'
];
function greeting() {
  var h = parseInt(F.hour.format(new Date()), 10) % 24;
  return h < 12 ? 'Vanakkam! ☀️ Morning shift is on.' : h < 17 ? 'Vanakkam! 🌤️ Afternoon loads rolling.' : h < 21 ? 'Vanakkam! 🌇 Evening shift, let\'s go.' : 'Night shift 🌙 — the tanker never sleeps.';
}
function fillQuip(m, seed) {
  if (m < 5)  return pick(['⚡ Pit-stop speed!', '⚡ Zoom zoom fill.'], seed);
  if (m < 10) return pick(['😎 Smooth and speedy.', '🏎️ Quick fill, zero drama.'], seed);
  if (m < 15) return pick(['👌 Textbook fill.', '💯 Right on schedule.'], seed);
  if (m < 25) return pick(['🐢 Taking it easy.', '🎶 Relaxed tempo.'], seed);
  if (m < 60) return pick(['🐌 Chai break suspected ☕', '🐌 Was there a vadai involved?'], seed);
  return '😴 Over an hour. Did someone fall asleep?';
}
function insideQuip(ms) {
  var m = ms / 60000;
  return m < 2 ? '🚿 Just rolled in. Hose engaged.' : m < 10 ? '💦 Glug glug glug…' : m < 20 ? '🦗 Filling nicely. Patience…' : m < 40 ? '🤨 Hmm, taking a while…' : '😴 Someone go check on them!';
}
function roadQuip(ms) {
  var m = ms / 60000;
  return m < 5 ? '💨 Just left. Vroom vroom!' : m < 20 ? '🛣️ Out delivering the goods.' : m < 45 ? '🎵 Cruising… windows down.' : m < 120 ? '🧭 Taking the scenic route?' : '📡 Hello? Tanker, come in…';
}

/* ================= data ================= */
function load() {
  if (S.loading) return;
  S.loading = true;
  $('#refreshBtn').innerHTML = '<span class="spin">🔄</span>';
  if (HAS_GAS && !S.data) {
    // first load: saved copy at once, fresh one after
    FCP.cached('getData', [], function (d, info) {
      onData(d);
      if (!info.fresh) { S.loading = true; $('#refreshBtn').innerHTML = '<span class="spin">🔄</span>'; }
    }).then(function () {
      S.loading = false; $('#refreshBtn').textContent = '🔄';
      S.lastLoad = Date.now(); S.nextLoad = S.lastLoad + REFRESH_MS;
    }, function (e) {
      if (S.data) { S.loading = false; $('#refreshBtn').textContent = '🔄'; S.nextLoad = Date.now() + 60000; }
      else onErr(e);
    });
    return;
  }
  if (HAS_GAS) google.script.run.withSuccessHandler(onData).withFailureHandler(onErr).getData();
  else setTimeout(function () { onData(mockData()); }, 400);
}

function onErr(e) {
  S.loading = false; $('#refreshBtn').textContent = '🔄';
  S.nextLoad = Date.now() + 60000; // retry sooner after a failure
  if (S.data) { toast('🕳️ Pothole! Update failed, retrying in a minute.'); return; }
  $('#app').innerHTML = '<div class="card err"><div style="font-size:48px">🕳️🚚</div><b>The tanker hit a pothole.</b><div class="meta">' + esc(e && e.message || e) + '</div><br><button class="btn" onclick="load()">Try again</button></div>';
}

function onData(d) {
  S.loading = false; $('#refreshBtn').textContent = '🔄';
  S.lastLoad = Date.now(); S.nextLoad = S.lastLoad + REFRESH_MS;
  setTZ(d.tz || TZ);
  if (!S.date) S.date = today();
  d.events.sort(function (a, b) { return a.t - b.t; });
  S.data = d;

  // pair IN → OUT per card
  var open = {}, trips = [];
  d.events.forEach(function (e) {
    if (e.ev === 'IN') open[e.uid] = e;
    else if (open[e.uid]) {
      var i = open[e.uid];
      trips.push({ uid: e.uid, name: i.name || e.name, tin: i.t, tout: e.t, mins: (e.t - i.t) / 60000 });
      delete open[e.uid];
    }
  });

  // comeback = previous real OUT → this IN (same tanker)
  var prevOut = {};
  trips.forEach(function (t) {
    t.day = dayKey(t.tout);
    t.test = t.mins < TEST_TAP_MIN;
    t.parked = t.mins >= PARKED_MIN;
    if (t.test) return;
    var p = prevOut[t.uid];
    t.back = (p && (t.tin - p) / 3600e3 <= NEW_DAY_GAP_H) ? (t.tin - p) / 60000 : null;
    prevOut[t.uid] = t.tout;
  });
  S.trips = trips;

  // tanker roster: sheet + anyone who shows up in the log
  var tk = {};
  d.tankers.forEach(function (x) { tk[x.uid] = { uid: x.uid, name: x.name, place: x.place, last: null, lastTrip: null }; });
  d.events.forEach(function (e) {
    if (!tk[e.uid]) tk[e.uid] = { uid: e.uid, name: e.name || e.uid, place: e.place, last: null, lastTrip: null };
    tk[e.uid].last = e;
  });
  trips.forEach(function (t) { if (!t.test && tk[t.uid]) tk[t.uid].lastTrip = t; });
  S.tankers = Object.keys(tk).map(function (k) { return tk[k]; });

  // anything new since the last fetch?
  var lastTrip = trips[trips.length - 1];
  var lastIn = d.events.filter(function (e) { return e.ev === 'IN'; }).pop();
  if (S.newestOut && lastTrip && lastTrip.tout > S.newestOut && !lastTrip.test) {
    toast(lastTrip.parked ? '🚚 ' + lastTrip.name + ' left with a load after parking ' + fmtDur(lastTrip.mins) : '💦 Load done! ' + lastTrip.name + ' filled in ' + fmtDur(lastTrip.mins)); splash();
  } else if (S.newestIn && lastIn && lastIn.t > S.newestIn) {
    toast('🚚 ' + lastIn.name + ' just rolled in. Filling time!'); splash();
  }
  S.newestOut = lastTrip ? lastTrip.tout : 1;
  S.newestIn = lastIn ? lastIn.t : 1;

  render();
}

/* ================= render ================= */
function render() {
  var key = S.date;
  var day = S.trips.filter(function (t) { return t.day === key; });
  var real = day.filter(function (t) { return !t.test; });
  var tests = day.length - real.length;
  var fills = real.filter(function (t) { return !t.parked; }).map(function (t) { return t.mins; });
  var backs = real.filter(function (t) { return t.back != null; }).map(function (t) { return t.back; });
  var h = '';

  // 1. where is the tanker
  h += '<h2>📍 Where is the tanker?</h2><div class="where">' + whereHTML() + '</div>';

  // 2. date + summary
  var isToday = key === today();
  h += '<h2>📅 Loads</h2><div class="card">' +
       '<div class="datebar">' +
         '<button class="btn" onclick="moveDay(-1)">◀</button>' +
         '<input type="date" id="datePick" value="' + key + '" max="' + today() + '" onchange="pickDay(this.value)">' +
         '<button class="btn" onclick="moveDay(1)" ' + (isToday ? 'disabled' : '') + '>▶</button>' +
         (isToday ? '' : '<button class="btn" onclick="pickDay(today())">Today</button>') +
       '</div>' +
       '<div class="daylabel">' + esc(niceDate(key)) + '</div>' +
       '<div class="sum">' +
         '<div class="card tile loads"><div class="e">🚰</div><div class="v' + (S.lastCount !== real.length ? ' pop' : '') + '">' + real.length + '</div><div class="k">' + (real.length === 1 ? 'load' : 'loads') + '</div></div>' +
         '<div class="card tile"><div class="e">💦</div><div class="v">' + (fills.length ? fmtDur(avg(fills)) : '—') + '</div><div class="k">avg fill time</div></div>' +
         '<div class="card tile"><div class="e">🛣️</div><div class="v">' + (backs.length ? fmtDur(avg(backs)) : '—') + '</div><div class="k">avg comeback</div></div>' +
       '</div>';
  if (fills.length) {
    var fFast = Math.min.apply(null, fills), fSlow = Math.max.apply(null, fills);
    h += '<div class="best">⚡ Fastest fill <b>' + fmtDur(fFast) + '</b> · 🐌 slowest <b>' + fmtDur(fSlow) + '</b>' +
         (backs.length ? ' · 🏁 quickest comeback <b>' + fmtDur(Math.min.apply(null, backs)) + '</b>' : '') + '</div>';
  }
  h += '</div>';
  S.lastCount = real.length;

  // 3. trip by trip
  h += '<h2>📜 Trip by trip <small>' + (tests ? tests + ' quick test ' + (tests === 1 ? 'tap' : 'taps') + ' not counted' : 'fill time & comeback time') + '</small></h2>' +
       '<div class="trips">' + tripsHTML(day, key) + '</div>';

  $('#app').innerHTML = h;
  tick();
}

function whereHTML() {
  var now = Date.now();
  if (!S.tankers.length) return '<div class="card empty"><div class="e">🫥</div>No tankers registered yet.</div>';
  return S.tankers.map(function (t) {
    var head = '<div class="nm">' + esc(t.name) + '</div><div class="pl">' + esc(t.place || '—') + ' · card ' + esc(t.uid) + '</div>';
    var e = t.last, lt = t.lastTrip;
    if (!e) return '<div class="card tk"><div class="bigicon">😶</div><div>' + head + '<span class="state park">NO TAPS YET</span><div class="quip">Shy tanker. Never seen at the gate.</div></div></div>';

    // IN — filling
    if (e.ev === 'IN' && now - e.t < 12 * 3600e3) {
      return '<div class="card tk in">' + miniTank() + '<div>' + head +
        '<span class="state in">💦 IN — FILLING</span>' +
        '<div class="timer" data-since="' + e.t + '">00:00</div>' +
        '<div class="meta">Came in at ' + fmtT(e.t) + (lt && lt.tout <= e.t && (e.t - lt.tout) / 3600e3 <= NEW_DAY_GAP_H ? ' · came back in ' + fmtDur((e.t - lt.tout) / 60000) : '') + '</div>' +
        '<div class="quip" data-iq="' + e.t + '"></div></div></div>';
    }
    // IN but very old — probably missed the OUT tap
    if (e.ev === 'IN') {
      return '<div class="card tk"><div class="bigicon">🤔</div><div>' + head +
        '<span class="state huh">IN SINCE ' + esc(fmtAgo(now - e.t).replace(' ago', '').toUpperCase()) + '</span>' +
        '<div class="quip">Tapped IN at ' + fmtT(e.t) + ' (' + niceDate(dayKey(e.t)) + ') and never tapped OUT. Forgot the card?</div></div></div>';
    }
    // OUT
    var park = now - e.t > NEW_DAY_GAP_H * 3600e3;
    return '<div class="card tk out"><div class="bigicon' + (park ? ' zzz' : '') + '">' + (park ? '💤' : '🛣️') + '</div><div>' + head +
      '<span class="state ' + (park ? 'park' : 'out') + '">' + (park ? '🅿️ OUT — PARKED' : '🚚 OUT — ON THE ROAD') + '</span>' +
      (park ? '<div class="quip">Last left ' + fmtT(e.t) + ', ' + niceDate(dayKey(e.t)) + '. Napping till the next shift.</div>'
            : '<div class="timer" data-since="' + e.t + '">00:00</div>' +
              '<div class="meta">Left at ' + fmtT(e.t) + (lt && lt.tout === e.t ? (lt.parked ? ' · was parked inside ' + fmtDur(lt.mins) : ' · last fill took ' + fmtDur(lt.mins)) : '') + '</div>' +
              '<div class="quip" data-rq="' + e.t + '"></div>') +
      '</div><div class="road' + (park ? ' park' : '') + '">' + (park ? '' : '<div class="dust">💨</div>') + '<div class="truck"><span>🚚</span></div></div></div>';
  }).join('');
}

function miniTank() {
  var wave = 'M0 6 Q10 0 20 6 T40 6 T60 6 T80 6 T100 6 T120 6 T140 6 T160 6 V120 H0 Z';
  return '<svg class="mini" viewBox="0 0 96 110">' +
    '<defs><clipPath id="mc"><rect x="10" y="14" width="76" height="88" rx="16"/></clipPath>' +
    '<linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd1ff"/><stop offset="1" stop-color="#1257b0"/></linearGradient></defs>' +
    '<rect x="36" y="4" width="24" height="12" rx="4" fill="rgba(255,255,255,.25)"/>' +
    '<rect x="44" y="0" width="8" height="18" fill="#8fe3ff"><animate attributeName="opacity" values="1;.4;1" dur=".6s" repeatCount="indefinite"/></rect>' +
    '<g clip-path="url(#mc)"><g class="lvl"><path class="wv" d="' + wave + '" fill="url(#mg)"/></g></g>' +
    '<rect x="10" y="14" width="76" height="88" rx="16" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="3"/>' +
    '</svg>';
}

function tripsHTML(day, key) {
  var rows = [], now = Date.now();
  // tanker inside right now (on this day)
  S.tankers.forEach(function (t) {
    var e = t.last;
    if (e && e.ev === 'IN' && now - e.t < 12 * 3600e3 && dayKey(e.t) === key) {
      rows.push('<div class="card trip now"><div class="num">💦</div><div><div class="tt">' + esc(t.name) + ' · in ' + fmtT(e.t) + ' → filling now…</div>' +
        '<div class="chips"><span class="chip fill">💦 filling <span data-since="' + e.t + '"></span></span></div></div></div>');
    }
  });
  var n = day.filter(function (t) { return !t.test; }).length;
  day.slice().reverse().forEach(function (t) {
    if (t.test) {
      rows.push('<div class="card trip test"><div class="num">👻</div><div><div class="tt">' + fmtT(t.tin) + ' → ' + fmtT(t.tout) + ' · ' + fmtDur(t.mins) + '</div><div class="q">Quick test tap, not counted</div></div></div>');
      return;
    }
    rows.push('<div class="card trip"><div class="num">' + n + '</div><div>' +
      '<div class="tt">' + esc(t.name) + ' · ' + fmtT(t.tin) + ' → ' + fmtT(t.tout) + '</div>' +
      '<div class="chips">' + (t.parked ? '<span class="chip first">🅿️ parked inside ' + fmtDur(t.mins) + '</span>' : '<span class="chip fill">💦 filled in ' + fmtDur(t.mins) + '</span>') +
      (t.back != null ? '<span class="chip back">🛣️ came back in ' + fmtDur(t.back) + '</span>' : '<span class="chip first">🌅 first trip</span>') +
      '</div><div class="q">' + (t.parked ? '💤 Filled and parked, left at ' + fmtT(t.tout) + '. Not in fill-time average.' : fillQuip(t.mins, t.tin)) + '</div></div></div>');
    n--;
  });
  if (!rows.length) return '<div class="card empty"><div class="e">🦗</div>No loads on this day.</div>';
  return rows.join('');
}

/* ================= live ticker (every second) ================= */
function tick() {
  var now = Date.now();
  document.querySelectorAll('[data-since]').forEach(function (el) { el.textContent = fmtClock(now - +el.getAttribute('data-since')); });
  document.querySelectorAll('[data-iq]').forEach(function (el) { el.textContent = insideQuip(now - +el.getAttribute('data-iq')); });
  document.querySelectorAll('[data-rq]').forEach(function (el) { el.textContent = roadQuip(now - +el.getAttribute('data-rq')); });
  if (S.lastLoad) $('#updated').textContent = 'Updated ' + fmtAgo(now - S.lastLoad) + ' · next update in ' + fmtClock(S.nextLoad - now);
  if (S.nextLoad && now >= S.nextLoad && !document.hidden) load();
}

/* ================= date nav ================= */
function pickDay(v) {
  if (!v) return;
  S.date = v > today() ? today() : v;
  render();
}
function moveDay(n) { pickDay(shiftDay(S.date, n)); }

/* ================= fun ================= */
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 4500);
}
function splash(x, y) {
  x = x == null ? innerWidth / 2 : x; y = y == null ? innerHeight / 3 : y;
  for (var i = 0; i < 14; i++) {
    var d = document.createElement('div'); d.className = 'drop'; d.textContent = i % 3 ? '💧' : '💦';
    var a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 140;
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.style.setProperty('--dx', Math.cos(a) * r + 'px'); d.style.setProperty('--dy', Math.sin(a) * r + 60 + 'px');
    document.body.appendChild(d); setTimeout(function (n) { return function () { n.remove(); }; }(d), 1400);
  }
}
function bubbles() {
  var b = $('#bubbles');
  for (var i = 0; i < 16; i++) {
    var s = document.createElement('span'), z = 6 + Math.random() * 26;
    s.style.width = s.style.height = z + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 10 + Math.random() * 16 + 's';
    s.style.animationDelay = -Math.random() * 20 + 's';
    b.appendChild(s);
  }
}

/* ================= preview data (only when opened outside Apps Script) ================= */
function mockData() {
  var now = Date.now(), ev = [], uid = '11CE2D07';
  for (var d = 6; d >= 0; d--) {
    var base = new Date(now - d * 864e5); base.setHours(6, 0, 0, 0);
    var t = base.getTime(), n = 4 + Math.floor(Math.random() * 9);
    for (var i = 0; i < n; i++) {
      t += (15 + Math.random() * 60) * 60000; if (t > now) break;
      var mins = Math.random() < 0.15 ? Math.random() * 0.8 : 5 + Math.random() * 22;
      ev.push({ t: t, uid: uid, name: 'Tuck Tanker', place: 'FCP', ev: 'IN' });
      var to = t + mins * 60000; if (to > now) break;
      ev.push({ t: to, uid: uid, name: 'Tuck Tanker', place: 'FCP', ev: 'OUT' }); t = to;
    }
  }
  return { tankers: [{ uid: uid, name: 'Tuck Tanker', place: 'FCP' }], events: ev, tz: TZ, now: now };
}

/* ================= boot ================= */
bubbles();
$('#refreshBtn').onclick = load;
$('#logo').onclick = function (e) { this.classList.remove('wiggle'); void this.offsetWidth; this.classList.add('wiggle'); splash(e.clientX, e.clientY); };
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.nextLoad && Date.now() >= S.nextLoad) load(); });

var subs = [greeting()].concat(SUBS);
$('#sub').textContent = subs[0];
setInterval(function () {
  var el = $('#sub'); el.style.opacity = 0;
  setTimeout(function () { S.qi = (S.qi + 1) % subs.length; el.textContent = subs[S.qi]; el.style.opacity = 1; }, 400);
}, 5000);
setInterval(tick, 1000);
load();
</script>
</body>
