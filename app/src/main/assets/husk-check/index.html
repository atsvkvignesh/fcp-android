<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCP Raw Material Check</title>
<link rel="stylesheet" href="../lib/fonts.css">
<link rel="stylesheet" href="../lib/app.css">
<script>window.FCP_PAGE = { app: 'husk-check' };</script>
<script src="../lib/config.js"></script>
<script src="../lib/fcp.js"></script>
<script src="../lib/gas-shim.js"></script>
<style>
:root{
  --husk:#1C1408; --husk2:#2B2012; --edge:#4A3A22; --fibre:#E2A93B; --cream:#F6EEDC; --paper:#FFFBF2;
  --ink:#2A2013; --mute:#7A6A50; --line:#E3D5B8; --sel:#FCE9C2; --bad:#E8734A; --good:#8FBF6A;
  --badInk:#B84A1C; --goodInk:#4C7A2A; --soft:#CDBB97;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:15px/1.45 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fibre);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top{background:var(--husk);color:var(--cream);padding:calc(14px + env(safe-area-inset-top)) 18px 0;position:sticky;top:0;z-index:20}
.top-in{max-width:1180px;margin:0 auto}
.brand{display:flex;gap:12px;align-items:center}
.mark{font-weight:700;font-size:13px;background:var(--fibre);color:var(--husk);border-radius:6px;padding:6px 7px}
h1{font:650 22px/1.1 Fraunces,serif;margin:0}
.brand p{margin:2px 0 0;color:var(--soft);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
.filters select,.filters input[type=date]{background:var(--husk2);color:var(--cream);border:1px solid var(--edge);border-radius:8px;padding:7px 10px;min-height:36px}
.filters select{max-width:230px}
.chips{display:flex;gap:2px;background:var(--husk2);border:1px solid var(--edge);border-radius:999px;padding:3px}
.chips button{background:none;border:0;color:var(--soft);padding:5px 12px;border-radius:999px}
.chips button.on{background:var(--fibre);color:var(--husk);font-weight:600}
.dates{display:flex;gap:6px;align-items:center;color:var(--soft);font-size:13px}
.refresh{margin-left:auto;background:none;border:1px solid var(--edge);color:var(--cream);border-radius:8px;padding:7px 12px}
.tabs{display:flex;gap:4px;margin-top:6px}
.tabs button{background:none;border:0;color:var(--soft);padding:10px 14px;border-bottom:3px solid transparent;font-weight:500}
.tabs button.on{color:var(--cream);border-bottom-color:var(--fibre)}
.tabs .count{font-size:12px;background:var(--husk2);border-radius:999px;padding:0 7px;margin-left:5px;color:var(--fibre)}
.busybar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--fibre);z-index:60}
body.busy .busybar{animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{left:0;width:0}50%{left:20%;width:60%}100%{left:100%;width:0}}

main{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
body.has-scale main{padding-bottom:230px}
.warn{background:#FBE3D6;border:1px solid #F0B69B;color:#5A2410;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}

/* match tab */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{background:none;border:0;padding:5px 13px;border-radius:999px;color:var(--mute)}
.seg button.on{background:var(--husk);color:var(--cream)}
.search{flex:1 1 220px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.side{display:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.col h2{font:650 18px Fraunces,serif;margin:4px 2px 4px;display:flex;align-items:baseline;gap:8px}
.col h2 span{font:500 13px Archivo;color:var(--mute)}
.day{font-weight:600;font-size:13px;color:var(--mute);margin:14px 2px 6px;display:flex;justify-content:space-between}
.card{display:flex;gap:10px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.card:hover{border-color:#CDB98F}
.card.sel{background:var(--sel);border-color:var(--fibre);box-shadow:inset 4px 0 0 var(--fibre)}
.card.hint:not(.sel){border-style:dashed;border-color:var(--fibre)}
.card.done{opacity:.6;cursor:default}
.tick{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #C9B58C;margin-top:2px}
.card.sel .tick{background:var(--fibre);border-color:var(--fibre);box-shadow:inset 0 0 0 3px var(--sel)}
.card.done .tick{border-style:dotted}
.cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.l1 b{font-weight:600}
.sub{color:var(--mute);font-size:13px}
.tm{margin-left:auto;color:var(--mute);font-size:13px}
.l2{font-size:14px}
.chip{font-style:normal;font-size:12px;background:#EFE3C8;border-radius:999px;padding:1px 8px;margin-left:4px;white-space:nowrap}
.chip.t-green{background:#DDEBCF}.chip.t-brown{background:#EAD6BE}.chip.v{background:#E9E2F2}
.nums{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-weight:600;margin-top:2px}
.nums small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.note{font-size:13px;color:var(--mute)}
.badge{align-self:flex-start;font-size:12px;border-radius:6px;padding:1px 8px;background:#E7DCC4;white-space:nowrap}
.s-MATCHED{background:#DDEBCF}.s-MISSING_AT_VENDOR,.s-MISSING_AT_FCP{background:#F6D3C4}.s-IGNORED{background:#E6E0D4}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--mute);font-size:14px}

/* the scale (selection bar) */
.scale{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--husk);color:var(--cream);padding:8px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(28,20,8,.28)}
.scale-in{max-width:1180px;margin:0 auto}
.beamwrap{position:relative;height:16px;margin:0 12%}
.beam{position:absolute;left:0;right:0;top:4px;height:3px;background:var(--fibre);border-radius:3px;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.beam::before,.beam::after{content:"";position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--fibre)}
.beam::before{left:-5px}.beam::after{right:-5px}
.fulcrum{position:absolute;left:50%;top:7px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid var(--fibre)}
.pans{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.pan .who{font-size:12px;color:var(--soft)}
.pan b{display:block;font:650 18px Fraunces,serif}
.pan .pv{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:#E4D4B0;font-variant-numeric:tabular-nums}
.pan.r{text-align:right}.pan.r .pv{justify-content:flex-end}
.mid{display:flex;gap:18px;text-align:center;align-items:flex-start}
.dl small{display:block;font-size:11px;color:var(--soft)}
.dl b{font:650 20px Fraunces,serif;font-variant-numeric:tabular-nums}
.dl.solo{color:var(--soft);font-size:13px;padding-top:6px}
.scale .neg{color:var(--bad)}.scale .pos{color:var(--good)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts input{flex:1 1 180px;background:var(--husk2);border:1px solid var(--edge);color:var(--cream);border-radius:8px;padding:8px 10px}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--fibre);color:var(--husk)}
.btn.miss{background:#F2C3AE;color:#4A1E0B}
.btn.ghost{background:transparent;color:var(--soft);border:1px solid var(--edge)}
.btn:disabled{opacity:.5;cursor:default}

/* summary */
.sumhead{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:4px 0 14px}
.sumhead h2{font:650 26px/1.1 Fraunces,serif;margin:0}
.sumhead p{margin:4px 0 0;color:var(--mute)}
.sumhead .btn{margin-left:auto}
.lightbtn{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile span{font-size:13px;color:var(--mute)}
.tile b{display:block;font:650 28px/1.15 Fraunces,serif;font-variant-numeric:tabular-nums}
.tile small{color:var(--mute);font-size:13px}
.tile.alert{border-color:#F0B69B;background:#FDF0E8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.grid2 .panel{margin-bottom:0}
.panel h3{font:650 18px Fraunces,serif;margin:0}
.panel .hint{color:var(--mute);font-size:13px;margin:2px 0 10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child th,tr:first-child td{border-top:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.total th,tr.total td{font-weight:600}
tr.dr th{font-weight:600}
tr.dr td.v{font:650 17px Fraunces,serif;text-align:right;white-space:nowrap}
td.why{color:var(--mute);font-size:13px}
.sum .neg{color:var(--badInk)}.sum .pos{color:var(--goodInk)}
.bottom{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
.bottom div small{display:block;color:var(--mute);font-size:13px}
.bottom div b{font:650 22px Fraunces,serif;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.scroll table{min-width:560px}
.list td{font-size:14px}

/* history */
.hrow{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.hrow .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hrow .hm{font-size:14px;grid-column:1}
.hrow .hm i{font-style:normal;color:var(--mute)}
.hrow .undo{grid-row:1/span 3;grid-column:2;align-self:center}
.lost{color:var(--badInk);font-size:13px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;background:var(--ink);color:var(--cream);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
body.has-scale .toast{bottom:210px}
.toast.err{background:#7A2A0E}
.toast button{background:none;border:1px solid var(--soft);color:var(--cream);border-radius:6px;padding:4px 10px}

@media (max-width:820px){
  .top{padding-left:12px;padding-right:12px}
  main{padding:12px 10px 40px}
  .cols{grid-template-columns:1fr}
  .side{display:flex;margin-bottom:8px}
  .side button{flex:1}
  .cols.show-c #colV,.cols.show-v #colC{display:none}
  .col h2{display:none}
  .pans{grid-template-columns:1fr 1fr}
  .mid{grid-column:1/-1;grid-row:2;justify-content:center}
  .pan b{font-size:16px}
  .tiles{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .refresh{margin-left:0}
  .tabs button{padding:9px 10px}
}
@media (prefers-reduced-motion:reduce){
  .beam{transition:none}
  body.busy .busybar{animation:none;width:100%;opacity:.6}
}
</style>
</head>
<body>
<div class="busybar"></div>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="mark">FCP</div>
      <div><h1>Raw material check</h1><p>Our husk loads against the vendor's slips</p></div>
    </div>
    <div class="filters">
      <select id="fVendor" aria-label="Vendor"></select>
      <div class="chips" id="preset">
        <button data-p="7">7 days</button>
        <button data-p="30">30 days</button>
        <button data-p="all">All</button>
        <button data-p="pick">Pick dates</button>
      </div>
      <div class="dates" id="dates" hidden>
        <input type="date" id="dFrom" aria-label="From"> to <input type="date" id="dTo" aria-label="To">
      </div>
      <button class="refresh" id="btnRefresh">Refresh</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="match" class="on">Match<span class="count" id="tPend"></span></button>
      <button data-tab="summary">Summary</button>
      <button data-tab="history">History</button>
    </nav>
  </div>
</header>

<main>
  <div id="warn"></div>

  <section id="tab-match">
    <div class="bar">
      <div class="seg" id="viewSeg">
        <button data-v="pending" class="on">To check</button>
        <button data-v="all">All</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search driver, truck, place or note">
    </div>
    <div class="seg side" id="sideSeg">
      <button data-s="c" class="on">Our loads <span id="sC"></span></button>
      <button data-s="v">Vendor <span id="sV"></span></button>
    </div>
    <div class="cols show-c" id="cols">
      <div class="col" id="colC"><h2>Our loads <span id="nC"></span></h2><div id="listC"></div></div>
      <div class="col" id="colV"><h2>Vendor entries <span id="nV"></span></h2><div id="listV"></div></div>
    </div>
  </section>

  <section id="tab-summary" class="sum" hidden></section>
  <section id="tab-history" class="sum" hidden></section>
</main>

<div class="scale" id="scale" hidden>
  <div class="scale-in">
    <div class="beamwrap"><div class="beam" id="beam"></div><div class="fulcrum"></div></div>
    <div class="pans">
      <div class="pan"><span class="who">Ours</span><b id="pC"></b><div class="pv" id="pCv"></div></div>
      <div class="mid" id="mid"></div>
      <div class="pan r"><span class="who">Vendor</span><b id="pV"></b><div class="pv" id="pVv"></div></div>
    </div>
    <div class="acts">
      <input id="note" placeholder="Note (optional)">
      <button class="btn pri" id="aMatch">Match</button>
      <button class="btn miss" id="aMissV">Missing at vendor</button>
      <button class="btn miss" id="aMissF">Missing at our end</button>
      <button class="btn ghost" id="aIgn">Ignore</button>
      <button class="btn ghost" id="aClr">Clear</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const LBL = { MATCHED:'Matched', MISSING_AT_VENDOR:'Missing at vendor', MISSING_AT_FCP:'Missing at our end', IGNORED:'Ignored' };
const S = {
  d:null, f:{ vendor:'', from:'', to:'', preset:'30' },
  selC:new Set(), selV:new Set(), view:'pending', q:'', side:'c', tab:'match', hist:'ALL',
  pin: sessionStorage.getItem('rm_pin') || '', mapC:{}, mapV:{}
};
const $ = id => document.getElementById(id);
const run = (fn, ...a) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n0 = v => Math.round(v || 0).toLocaleString('en-IN');
const rs = v => '₹' + n0(v);
const sgn = v => { v = Math.round(v || 0); return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('en-IN'); };
const rsg = v => { v = Math.round(v || 0); return (v > 0 ? '+' : v < 0 ? '−' : '') + '₹' + Math.abs(v).toLocaleString('en-IN'); };
const cls = v => { v = Math.round(v || 0); return v < 0 ? 'neg' : v > 0 ? 'pos' : ''; };
const pct = (v, b) => b ? (Math.abs(v) / b * 100).toFixed(1) + '%' : '';
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const msg = e => (e && e.message) ? e.message : String(e);
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dfmt = dk => { if (!dk) return '—'; const p = dk.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' }); };
const dshort = dk => { if (!dk) return '—'; const p = dk.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-IN', { day:'numeric', month:'short' }); };
const filt = () => ({ from:S.f.from, to:S.f.to, vendor:S.f.vendor });

/* ---------- load ---------- */
function busy(on) {
  document.body.classList.toggle('busy', on);
  document.querySelectorAll('.acts .btn, #btnRefresh').forEach(b => b.disabled = on);
}
async function load() {
  let shown = false;
  busy(true);
  try {
    await FCP.cached('api_load', [filt()], d => { if (!shown) { shown = true; busy(false); } apply(d); });
  } catch (e) {
    if (!e.hadSaved && !e.stale) toast(msg(e), null, true);
  } finally {
    if (!shown) busy(false);
  }
}
function apply(d) {
  S.d = d;
  S.mapC = {}; S.mapV = {};
  d.loads.forEach(x => S.mapC[x.k] = x);
  d.entries.forEach(x => S.mapV[x.k] = x);
  S.selC = new Set([...S.selC].filter(k => S.mapC[k] && !S.mapC[k].gid));
  S.selV = new Set([...S.selV].filter(k => S.mapV[k] && !S.mapV[k].gid));
  fillVendors();
  $('warn').innerHTML = d.meta.hasVendorCol ? '' :
    '<div class="warn">The vendor form has no "Vendor Name" question yet, so every vendor entry shows under every vendor. Add a Vendor Name question to the vendor form to keep vendors apart.</div>';
  render();
}
function fillVendors() {
  const sel = $('fVendor');
  const opts = ['<option value="">All vendors</option>'].concat(S.d.vendors.map(v =>
    `<option value="${esc(v.key)}">${esc(v.name)}${v.pending ? ' (' + v.pending + ' to check)' : ''}</option>`));
  sel.innerHTML = opts.join('');
  sel.value = S.f.vendor;
}

/* ---------- filters ---------- */
function setPreset(p, reload) {
  S.f.preset = p;
  document.querySelectorAll('#preset button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  $('dates').hidden = p !== 'pick';
  if (p === 'all') { S.f.from = ''; S.f.to = ''; }
  else if (p === 'pick') {
    if (!S.f.from) { const t = new Date(), f = new Date(); f.setDate(t.getDate() - 29); S.f.from = iso(f); S.f.to = iso(t); }
    $('dFrom').value = S.f.from; $('dTo').value = S.f.to;
  } else {
    const t = new Date(), f = new Date(); f.setDate(t.getDate() - (+p - 1));
    S.f.from = iso(f); S.f.to = iso(t);
  }
  if (reload !== false) load();
}

/* ---------- render ---------- */
function render() {
  if (!S.d) return;
  const pc = S.d.loads.filter(x => !x.gid).length, pv = S.d.entries.filter(x => !x.gid).length;
  $('tPend').textContent = pc + pv ? pc + pv : '';
  renderMatch();
  renderScale();
  if (S.tab === 'summary') renderSummary();
  if (S.tab === 'history') renderHistory();
}

function visible(list, isC) {
  const q = S.q.toLowerCase();
  return list.filter(x => (S.view === 'all' || !x.gid) &&
      (!q || (isC ? [x.driver, x.truck, x.place, x.note, x.unload, x.vendor] : [x.place, x.type, x.note, x.truck, x.vendor])
        .join(' ').toLowerCase().includes(q)))
    .sort((a, b) => a.dk < b.dk ? -1 : a.dk > b.dk ? 1 : a.tm - b.tm);
}

function listHtml(list, card, emptyMsg) {
  if (!list.length) return `<div class="empty">${emptyMsg}</div>`;
  let h = '', last = '';
  const perDay = {};
  list.forEach(x => perDay[x.dk] = (perDay[x.dk] || 0) + 1);
  list.forEach(x => {
    if (x.dk !== last) { h += `<div class="day"><span>${dfmt(x.dk)}</span><span>${perDay[x.dk]}</span></div>`; last = x.dk; }
    h += card(x);
  });
  return h;
}

function cardC(x, hint) {
  const sel = S.selC.has(x.k), done = !!x.gid;
  const counts = (x.green || !x.brown ? `<span><small>Green</small>${n0(x.green)}</span>` : '') +
                 (x.brown ? `<span><small>Brown</small>${n0(x.brown)}</span>` : '');
  return `<button class="card${sel ? ' sel' : ''}${done ? ' done' : ''}${hint ? ' hint' : ''}" data-c="${esc(x.k)}"${done ? ' disabled' : ''} aria-pressed="${sel}">
    <span class="tick"></span>
    <span class="cb">
      <span class="l1"><b>${esc(x.driver || 'No driver')}</b><span class="sub">${esc(x.truck)}</span><span class="tm">${esc(x.time)}</span></span>
      <span class="l2">${esc(x.place || 'No place')}${x.unload ? `<i class="chip">${esc(x.unload)}</i>` : ''}${!S.f.vendor && x.vendor ? `<i class="chip v">${esc(x.vendor)}</i>` : ''}</span>
      <span class="nums">${counts}<span><small>Driver total</small>${n0(x.count)}</span><span><small>CFT</small>${x.cft == null ? '—' : n0(x.cft)}</span><span><small>Cost</small>${rs(x.cost)}</span></span>
      ${x.note ? `<span class="note">${esc(x.note)}</span>` : ''}
      ${done ? `<span class="badge s-${x.status}">${LBL[x.status] || x.status}</span>` : ''}
    </span></button>`;
}

function cardV(x, hint) {
  const sel = S.selV.has(x.k), done = !!x.gid;
  return `<button class="card${sel ? ' sel' : ''}${done ? ' done' : ''}${hint ? ' hint' : ''}" data-v="${esc(x.k)}"${done ? ' disabled' : ''} aria-pressed="${sel}">
    <span class="tick"></span>
    <span class="cb">
      <span class="l1"><b>${esc(x.place || 'No place')}</b><i class="chip t-${x.tk}">${esc(x.type)}</i><span class="tm">${esc(x.entered)}</span></span>
      ${(x.truck || (!S.f.vendor && x.vendor)) ? `<span class="l2">${esc(x.truck)}${!S.f.vendor && x.vendor ? `<i class="chip v">${esc(x.vendor)}</i>` : ''}</span>` : ''}
      <span class="nums"><span><small>Husk</small>${n0(x.count)}</span><span><small>Rate</small>₹${(x.rate || 0).toFixed(2)}</span><span><small>Amount</small>${rs(x.total)}</span></span>
      ${x.note ? `<span class="note">${esc(x.note)}</span>` : ''}
      ${done ? `<span class="badge s-${x.status}">${LBL[x.status] || x.status}</span>` : ''}
    </span></button>`;
}

function renderMatch() {
  const d = S.d;
  const datesC = new Set(d.loads.filter(x => S.selC.has(x.k)).map(x => x.dk));
  const datesV = new Set(d.entries.filter(x => S.selV.has(x.k)).map(x => x.dk));
  const lc = visible(d.loads, true), lv = visible(d.entries, false);
  const pc = d.loads.filter(x => !x.gid).length, pv = d.entries.filter(x => !x.gid).length;

  const emptyC = S.q ? 'No loads match your search.' :
    d.loads.length ? 'Every one of our loads in this range is checked.' : 'No loads from our side in this range.';
  const emptyV = S.q ? 'No vendor entries match your search.' :
    d.entries.length ? 'Every vendor entry in this range is checked.' : 'No vendor entries in this range yet. They show here once the vendor form is filled.';

  $('listC').innerHTML = listHtml(lc, x => cardC(x, datesV.has(x.dk)), emptyC);
  $('listV').innerHTML = listHtml(lv, x => cardV(x, datesC.has(x.dk)), emptyV);
  $('nC').textContent = pc + ' to check';
  $('nV').textContent = pv + ' to check';
  $('sC').textContent = '(' + pc + ')';
  $('sV').textContent = '(' + pv + ')';
}

function selTotals() {
  const t = { nc:0, nv:0, driver:0, cft:0, noCft:0, our:0, vc:0, ven:0 };
  S.selC.forEach(k => { const x = S.mapC[k]; if (!x) return; t.nc++; t.driver += x.count; t.our += x.cost; if (x.cft == null) t.noCft++; else t.cft += x.cft; });
  S.selV.forEach(k => { const x = S.mapV[k]; if (!x) return; t.nv++; t.vc += x.count; t.ven += x.total; });
  return t;
}

function renderScale() {
  const t = selTotals(), any = t.nc + t.nv > 0;
  $('scale').hidden = !any;
  document.body.classList.toggle('has-scale', any);
  if (!any) return;
  $('pC').textContent = t.nc ? plural(t.nc, 'load', 'loads') : 'None picked';
  $('pCv').innerHTML = t.nc ? `<span>${n0(t.driver)} husk</span><span>CFT ${t.cft ? n0(t.cft) : '—'}</span><span>${rs(t.our)}</span>` : '';
  $('pV').textContent = t.nv ? plural(t.nv, 'entry', 'entries') : 'None picked';
  $('pVv').innerHTML = t.nv ? `<span>${n0(t.vc)} husk</span><span>${rs(t.ven)}</span>` : '';

  let tilt = 0;
  if (t.nc && t.nv) {
    const dv = t.driver - t.vc, cv = t.our - t.ven;
    tilt = Math.max(-7, Math.min(7, (t.ven - t.our) / Math.max(t.our, t.ven, 1) * 60));
    $('mid').innerHTML = `<div class="dl"><small>Driver − Vendor</small><b class="${cls(dv)}">${sgn(dv)}</b></div>
      <div class="dl"><small>Company − Vendor</small><b class="${cls(cv)}">${rsg(cv)}</b></div>`;
  } else {
    tilt = t.nc ? -5 : 5;
    $('mid').innerHTML = `<div class="dl solo">${t.nc ? 'Only our loads picked' : 'Only vendor entries picked'}</div>`;
  }
  $('beam').style.transform = `rotate(${tilt}deg)`;
  $('aMatch').hidden = !(t.nc && t.nv);
  $('aMissV').hidden = !(t.nc && !t.nv);
  $('aMissF').hidden = !(t.nv && !t.nc);
}

/* ---------- actions ---------- */
function ensurePin() {
  if (!S.d.meta.pin || S.pin) return true;
  const p = prompt('Enter the edit PIN');
  if (!p) return false;
  S.pin = p;
  return true;
}
async function act(status) {
  if (!ensurePin()) return;
  const t = selTotals();
  const vname = S.f.vendor ? (S.d.vendors.find(v => v.key === S.f.vendor) || {}).name || '' : '';
  const payload = { status, cks:[...S.selC], vks:[...S.selV], note:$('note').value.trim(), pin:S.pin, vendorName:vname, filter:filt() };
  busy(true);
  try {
    const d = await run('api_save', payload);
    sessionStorage.setItem('rm_pin', S.pin);
    S.selC.clear(); S.selV.clear(); $('note').value = '';
    apply(d);
    const text = status === 'MATCHED' ? `Matched ${plural(t.nc, 'load', 'loads')} with ${plural(t.nv, 'vendor entry', 'vendor entries')}.`
      : status === 'MISSING_AT_VENDOR' ? `Marked ${plural(t.nc, 'load', 'loads')} missing at vendor.`
      : status === 'MISSING_AT_FCP' ? `Marked ${plural(t.nv, 'entry', 'entries')} missing at our end.`
      : `Ignored ${plural(t.nc + t.nv, 'row', 'rows')}.`;
    toast(text, () => undo(d.savedIds));
  } catch (e) {
    if (/PIN/i.test(msg(e))) { S.pin = ''; sessionStorage.removeItem('rm_pin'); }
    toast(msg(e), null, true);
  } finally { busy(false); }
}
async function undo(ids) {
  if (!ensurePin()) return;
  busy(true);
  try { apply(await run('api_undo', { ids, pin:S.pin, filter:filt() })); toast('Undone. Those rows are back in To check.'); }
  catch (e) { toast(msg(e), null, true); }
  finally { busy(false); }
}
async function exportSheet() {
  busy(true);
  try {
    const r = await run('api_export', filt());
    toast(`Exported ${r.rows} rows to the "RM Check Export" tab.`, () => window.open(r.url, '_blank'), false, 'Open sheet');
  } catch (e) { toast(msg(e), null, true); }
  finally { busy(false); }
}

let toastTimer;
function toast(text, onAction, isErr, actionLabel) {
  const el = $('toast');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.innerHTML = `<span>${esc(text)}</span>` + (onAction ? `<button id="toastBtn">${actionLabel || 'Undo'}</button>` : '');
  el.hidden = false;
  if (onAction) $('toastBtn').onclick = () => { el.hidden = true; onAction(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.hidden = true, isErr ? 9000 : 7000);
}

/* ---------- summary ---------- */
function renderSummary() {
  const s = S.d.summary, m = s.m, meta = S.d.meta;
  const who = meta.vendor || 'All vendors';
  const range = S.f.from || S.f.to ? `${S.f.from ? dfmt(S.f.from) : 'Start'} to ${S.f.to ? dfmt(S.f.to) : 'latest'}` : 'All dates';
  const tile = (t, big, sub, alert) => `<div class="tile${alert ? ' alert' : ''}"><span>${t}</span><b>${big}</b><small>${sub}</small></div>`;
  const row = (k, v, why) => `<tr class="total"><th>${k}</th><td class="n">${v}</td><td class="why">${why || ''}</td></tr>`;
  const dr = (k, v, pos, neg, fmt, base, colored) => {
    const r = Math.round(v || 0);
    return `<tr class="dr"><th>${k}</th><td class="v ${colored ? cls(v) : ''}">${fmt(v)}</td>
      <td class="why">${r > 0 ? pos : r < 0 ? neg : 'Same'}${base && r ? ` (${pct(v, base)})` : ''}</td></tr>`;
  };

  let h = `<div class="sumhead"><div><h2>${esc(who)}</h2><p>${range}</p></div>
    <button class="btn lightbtn" id="btnExport">Export to sheet</button></div>`;

  h += `<div class="tiles">
    ${tile('Matched', n0(s.groups), `${plural(m.loads, 'our load', 'our loads')}, ${plural(m.entries, 'vendor entry', 'vendor entries')}`)}
    ${tile('Still to check', n0(s.pendC.n + s.pendV.n), `${s.pendC.n} ours, ${s.pendV.n} vendor`, s.pendC.n + s.pendV.n > 0)}
    ${tile('Missing at vendor', n0(s.missV.n), `${n0(s.missV.husk)} husk, ${rs(s.missV.cost)}`)}
    ${tile('Missing at our end', n0(s.missF.n), `${n0(s.missF.husk)} husk, ${rs(s.missF.cost)}`, s.missF.n > 0)}
  </div>`;

  h += `<div class="grid2">
    <div class="panel"><h3>Husk count</h3><p class="hint">Matched loads only</p><table>
      ${row('Driver count', n0(m.driver))}
      ${row('Vendor count', n0(m.vendor))}
      ${row('CFT count', n0(m.cft), m.noCft ? `${plural(m.noCft, 'load has', 'loads have')} no CFT reading and are left out of the CFT lines` : 'Estimated from truck size')}
      ${dr('Driver − Vendor', m.dV, 'Vendor counted less', 'Vendor counted more', sgn, m.driver, true)}
      ${dr('Driver − CFT', m.dC, 'Driver above CFT estimate', 'Driver below CFT estimate', sgn, m.driverCft)}
      ${dr('Vendor − CFT', m.vC, 'Vendor above CFT estimate', 'Vendor below CFT estimate', sgn, m.cft)}
    </table></div>
    <div class="panel"><h3>Cost</h3><p class="hint">Matched loads only</p><table>
      ${row('Company total', rs(m.ourCost), 'Driver count at our price')}
      ${row('Vendor total', rs(m.vendorCost))}
      ${row('CFT value', rs(m.cftCost), 'CFT count at our price for each load')}
      ${dr('Company − Vendor', m.cV, 'Vendor billed less', 'Vendor billed more', rsg, m.ourCost, true)}
      ${dr('Company − CFT value', m.cC, 'We pay above CFT value', 'We pay below CFT value', rsg, m.costCft)}
      ${dr('Vendor − CFT value', m.vCc, 'Vendor above CFT value', 'Vendor below CFT value', rsg, m.cftCost)}
    </table></div>
  </div>`;

  const gap = s.ourAll - s.vendorAll;
  h += `<div class="panel"><h3>Whole period</h3><p class="hint">Every entry in this range, including loads still to check and missing ones. Ignored rows are left out.</p>
    <div class="bottom">
      <div><small>Vendor's slips</small><b>${rs(s.vendorAll)}</b></div>
      <div><small>Our loads</small><b>${rs(s.ourAll)}</b></div>
      <div><small>Our record − vendor claim</small><b class="${cls(gap)}">${rsg(gap)}</b></div>
    </div></div>`;

  if (!S.f.vendor && s.byVendor.length > 1) {
    h += `<div class="panel"><h3>By vendor</h3><div class="scroll"><table class="list">
      <tr><th>Vendor</th><th class="n">Matched</th><th class="n">Driver − Vendor</th><th class="n">Company − Vendor</th><th class="n">Missing at vendor</th><th class="n">Missing at our end</th><th class="n">To check</th></tr>
      ${s.byVendor.map(b => `<tr><td>${esc(b.name)}</td><td class="n">${b.groups}</td>
        <td class="n ${cls(b.m.dV)}">${sgn(b.m.dV)}</td><td class="n ${cls(b.m.cV)}">${rsg(b.m.cV)}</td>
        <td class="n">${b.missV.n ? `${b.missV.n} (${rs(b.missV.cost)})` : '0'}</td>
        <td class="n">${b.missF.n ? `${b.missF.n} (${rs(b.missF.cost)})` : '0'}</td>
        <td class="n">${b.pendC.n} ours, ${b.pendV.n} vendor</td></tr>`).join('')}
    </table></div></div>`;
  }

  const groups = S.d.groups;
  const matched = groups.filter(g => g.status === 'MATCHED' && Math.round(g.m.cV))
    .sort((a, b) => Math.abs(b.m.cV) - Math.abs(a.m.cV)).slice(0, 10);
  if (matched.length) {
    h += `<div class="panel"><h3>Biggest differences</h3><p class="hint">Matched loads, largest cost gap first</p><div class="scroll"><table class="list">
      <tr><th>Date</th><th>Our loads</th><th class="n">Driver</th><th class="n">Vendor</th><th class="n">CFT</th><th class="n">Driver − Vendor</th><th class="n">Company − Vendor</th></tr>
      ${matched.map(g => `<tr><td>${dshort(g.dk)}</td><td>${esc(whoC(g))}</td><td class="n">${n0(g.m.driver)}</td><td class="n">${n0(g.m.vendor)}</td><td class="n">${n0(g.m.cft)}</td>
        <td class="n ${cls(g.m.dV)}">${sgn(g.m.dV)}</td><td class="n ${cls(g.m.cV)}">${rsg(g.m.cV)}</td></tr>`).join('')}
    </table></div></div>`;
  }

  const missV = groups.filter(g => g.status === 'MISSING_AT_VENDOR');
  const missF = groups.filter(g => g.status === 'MISSING_AT_FCP');
  if (missV.length || missF.length) {
    h += `<div class="grid2">
      <div class="panel"><h3>Missing at vendor</h3><p class="hint">Our loads the vendor has no slip for</p>
        ${missV.length ? `<table class="list">${missV.map(g => g.cks.map(k => S.mapC[k]).filter(Boolean).map(x =>
          `<tr><td>${dshort(x.dk)}</td><td>${esc(x.driver)} ${esc(x.truck)}<br><span class="note">${esc(x.place)}</span></td><td class="n">${n0(x.count)}</td><td class="n">${rs(x.cost)}</td></tr>`).join('')).join('')}</table>` : '<p class="note">None</p>'}
      </div>
      <div class="panel"><h3>Missing at our end</h3><p class="hint">Vendor entries with no load on our side</p>
        ${missF.length ? `<table class="list">${missF.map(g => g.vks.map(k => S.mapV[k]).filter(Boolean).map(x =>
          `<tr><td>${dshort(x.dk)}</td><td>${esc(x.place)}<br><span class="note">${esc(x.type)}</span></td><td class="n">${n0(x.count)}</td><td class="n">${rs(x.total)}</td></tr>`).join('')).join('')}</table>` : '<p class="note">None</p>'}
      </div></div>`;
  }

  $('tab-summary').innerHTML = h;
}

function whoC(g) {
  return g.cks.map(k => S.mapC[k]).filter(Boolean).map(x => [x.driver, x.place].filter(Boolean).join(', ')).join(' + ') || '—';
}
function whoV(g) {
  return g.vks.map(k => S.mapV[k]).filter(Boolean).map(x => [x.place, x.type].filter(Boolean).join(', ')).join(' + ') || '—';
}

/* ---------- history ---------- */
function renderHistory() {
  const all = S.d.groups;
  const counts = { ALL: all.length };
  all.forEach(g => counts[g.status] = (counts[g.status] || 0) + 1);
  const keys = ['ALL', 'MATCHED', 'MISSING_AT_VENDOR', 'MISSING_AT_FCP', 'IGNORED'];
  let h = `<div class="bar"><div class="seg" id="histSeg">${keys.map(k =>
    `<button data-h="${k}" class="${S.hist === k ? 'on' : ''}">${k === 'ALL' ? 'All' : LBL[k]} ${counts[k] || 0}</button>`).join('')}</div></div>`;

  const list = all.filter(g => S.hist === 'ALL' || g.status === S.hist)
    .sort((a, b) => a.dk < b.dk ? 1 : a.dk > b.dk ? -1 : (b.id > a.id ? 1 : -1));
  if (!list.length) h += '<div class="empty">Nothing saved in this range yet. Pick loads on the Match tab to start.</div>';

  h += list.map(g => {
    const m = g.m;
    let nums = '';
    if (g.status === 'MATCHED') {
      nums = `<span class="nums"><span><small>Driver</small>${n0(m.driver)}</span><span><small>Vendor</small>${n0(m.vendor)}</span><span><small>CFT</small>${n0(m.cft)}</span>
        <span><small>Driver − Vendor</small><span class="${cls(m.dV)}">${sgn(m.dV)}</span></span>
        <span><small>Company − Vendor</small><span class="${cls(m.cV)}">${rsg(m.cV)}</span></span></span>`;
    } else if (g.status === 'MISSING_AT_VENDOR') {
      nums = `<span class="nums"><span><small>Husk</small>${n0(m.driver)}</span><span><small>Our cost</small>${rs(m.ourCost)}</span></span>`;
    } else if (g.status === 'MISSING_AT_FCP') {
      nums = `<span class="nums"><span><small>Husk</small>${n0(m.vendor)}</span><span><small>Vendor cost</small>${rs(m.vendorCost)}</span></span>`;
    }
    const sides = [g.cks.length ? `<i>Ours:</i> ${esc(whoC(g))}` : '', g.vks.length ? `<i>Vendor:</i> ${esc(whoV(g))}` : ''].filter(Boolean).join('<br>');
    return `<div class="hrow">
      <div class="hd"><span class="badge s-${g.status}">${LBL[g.status] || g.status}</span><b>${dfmt(g.dk)}</b>${g.vendor ? `<span class="sub">${esc(g.vendor)}</span>` : ''}</div>
      <div class="hm">${sides}</div>
      ${nums ? `<div class="hm">${nums}</div>` : ''}
      ${g.note ? `<div class="hm note">${esc(g.note)}</div>` : ''}
      ${g.lost ? `<div class="hm lost">${plural(g.lost, 'row was', 'rows were')} deleted from the sheet after saving.</div>` : ''}
      <div class="hm note">Saved ${esc(g.created)}${g.by ? ' by ' + esc(g.by) : ''}</div>
      <button class="btn lightbtn undo" data-undo="${esc(g.id)}">Undo</button>
    </div>`;
  }).join('');
  $('tab-history').innerHTML = h;
}

/* ---------- wiring ---------- */
function setTab(t) {
  S.tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['match', 'summary', 'history'].forEach(k => $('tab-' + k).hidden = k !== t);
  render();
  window.scrollTo(0, 0);
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('#preset button').forEach(b => b.onclick = () => setPreset(b.dataset.p));
  const onDates = () => {
    S.f.from = $('dFrom').value; S.f.to = $('dTo').value;
    if (S.f.from && S.f.to && S.f.from > S.f.to) { const t = S.f.from; S.f.from = S.f.to; S.f.to = t; $('dFrom').value = S.f.from; $('dTo').value = S.f.to; }
    load();
  };
  $('dFrom').onchange = onDates; $('dTo').onchange = onDates;
  $('fVendor').onchange = () => { S.f.vendor = $('fVendor').value; S.selC.clear(); S.selV.clear(); load(); };
  $('btnRefresh').onclick = load;
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

  $('viewSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    S.view = b.dataset.v; document.querySelectorAll('#viewSeg button').forEach(x => x.classList.toggle('on', x === b)); renderMatch(); };
  $('sideSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    S.side = b.dataset.s; document.querySelectorAll('#sideSeg button').forEach(x => x.classList.toggle('on', x === b));
    $('cols').className = 'cols show-' + S.side; };
  let qt;
  $('q').oninput = () => { clearTimeout(qt); qt = setTimeout(() => { S.q = $('q').value.trim(); renderMatch(); }, 150); };

  $('listC').onclick = e => { const b = e.target.closest('.card[data-c]'); if (!b || b.disabled) return;
    const k = b.dataset.c; S.selC.has(k) ? S.selC.delete(k) : S.selC.add(k); renderMatch(); renderScale(); };
  $('listV').onclick = e => { const b = e.target.closest('.card[data-v]'); if (!b || b.disabled) return;
    const k = b.dataset.v; S.selV.has(k) ? S.selV.delete(k) : S.selV.add(k); renderMatch(); renderScale(); };

  $('aMatch').onclick = () => act('MATCHED');
  $('aMissV').onclick = () => act('MISSING_AT_VENDOR');
  $('aMissF').onclick = () => act('MISSING_AT_FCP');
  $('aIgn').onclick = () => act('IGNORED');
  $('aClr').onclick = () => { S.selC.clear(); S.selV.clear(); renderMatch(); renderScale(); };

  document.addEventListener('click', e => {
    if (e.target.id === 'btnExport') exportSheet();
    const u = e.target.closest('[data-undo]');
    if (u) undo([u.dataset.undo]);
    const hb = e.target.closest('#histSeg button');
    if (hb) { S.hist = hb.dataset.h; renderHistory(); }
  });

  setPreset('30', false);
  load();
});
</script>
</body>
</html>
