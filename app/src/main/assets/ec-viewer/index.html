<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCP EC Viewer</title>
<link rel="stylesheet" href="../lib/fonts.css">
<link rel="stylesheet" href="../lib/app.css">
<script>window.FCP_PAGE = { app: 'ec-viewer' };</script>
<script src="../lib/config.js"></script>
<script src="../lib/fcp.js"></script>
<script src="../lib/gas-shim.js"></script>
<style>
  :root{
    --husk:#16211C; --husk-2:#212F29; --husk-3:#26362E;
    --fibre:#8FBFA3; --cream:#EEF0E6; --muted:#9FB3A8;
    --edge:rgba(143,191,163,.24); --line:rgba(143,191,163,.14);
    --bad:#D98F72; --bad-soft:#F0C7B4; --good:#8FBF6A;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;color:var(--cream);font-family:Archivo,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4;
    background:radial-gradient(120% 80% at 50% -10%,#263A30 0%,rgba(38,58,48,0) 60%),var(--husk);
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
    background:repeating-linear-gradient(24deg,#8FBFA3 0 1px,transparent 1px 7px),
               repeating-linear-gradient(-61deg,#8FBFA3 0 1px,transparent 1px 11px)}
  .wrap{position:relative;max-width:560px;margin:0 auto;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
  h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700}

  /* header */
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .bar img{width:44px;height:auto}
  .bar .ttl{flex:1;min-width:0}
  .bar .ttl b{font-family:Fraunces,Georgia,serif;font-size:18px;display:block;line-height:1.2}
  .bar .ttl span{color:var(--muted);font-size:12.5px}

  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;
    font:inherit;font-weight:600;font-size:14.5px;color:#17231D;
    background:linear-gradient(180deg,#A9D9BE,#79B393);border:1px solid transparent;border-radius:11px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--cream);border-color:var(--edge)}
  .btn.on{background:var(--bad);color:#17231D;border-color:var(--bad)}
  .btn:disabled{opacity:.5}
  .btn:active{transform:translateY(1px)}
  :focus-visible{outline:2px solid var(--fibre);outline-offset:2px}

  /* the two tabs */
  .tabs{display:flex;gap:4px;padding:4px;margin-bottom:12px;background:#121C17;border:1px solid var(--edge);border-radius:14px}
  .tabs button{flex:1;min-height:46px;font:inherit;font-weight:600;font-size:15.5px;color:var(--muted);
    background:none;border:0;border-radius:10px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--fibre);color:#17231D}

  /* filters */
  .chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto;min-height:36px;padding:6px 13px;font:inherit;font-size:14px;color:var(--cream);
    background:#17221D;border:1px solid var(--edge);border-radius:999px;cursor:pointer}
  .chips button[aria-pressed="true"]{background:var(--cream);color:#17231D;border-color:var(--cream);font-weight:600}
  .pair{display:flex;gap:10px;margin-bottom:12px}
  .pair>*{flex:1;min-width:0}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
  input,select{width:100%;min-height:44px;padding:10px 12px;font:inherit;font-size:15px;color:var(--cream);
    background:#16211D;border:1px solid #3C5347;border-radius:10px;outline:none}
  select{-webkit-appearance:none;appearance:none;padding-right:34px;background-repeat:no-repeat;background-position:right 12px center;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%239FB3A8' stroke-width='1.6'/></svg>")}
  input:focus,select:focus{border-color:var(--fibre)}
  input[type=date]{color-scheme:dark}

  /* summary */
  .card{background:var(--husk-2);border:1px solid var(--edge);border-radius:16px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .head{display:flex;gap:28px}
  .big{font-family:Fraunces,Georgia,serif;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
  .big.warn{color:var(--bad-soft)}
  .cap{color:var(--muted);font-size:12.5px;margin-top:3px}
  .track{height:6px;border-radius:99px;background:#25352E;overflow:hidden;margin:14px 0 12px}
  .track i{display:block;height:100%;width:0;background:var(--bad)}
  .note{color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 0}
  .flag{color:var(--bad-soft)}
  .ok{color:var(--good)}

  .tiles{display:flex;gap:10px}
  .tile{flex:1;min-width:0;background:var(--husk-3);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px}
  .tile .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:600}
  .tile .t span{color:var(--muted);font-weight:400;font-size:12px}
  .tile .v{font-family:Fraunces,Georgia,serif;font-size:26px;line-height:1.15;margin:4px 0 2px}
  .tile .v small{font-family:Archivo,sans-serif;font-size:12px;color:var(--muted);font-weight:400;margin-left:5px}
  .tile .s{color:var(--muted);font-size:12.5px;line-height:1.5}

  .mini{display:flex;gap:10px}
  .mini>div{flex:1;min-width:0;background:var(--husk-3);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .mini b{display:block;font-family:Fraunces,Georgia,serif;font-size:22px;line-height:1.2}
  .mini span{color:var(--muted);font-size:12px}

  /* yard cards */
  .yhead{display:flex;align-items:center;gap:8px}
  .yhead h3{flex:1;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{flex:0 0 auto;font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid}
  .pill.flag{border-color:rgba(217,143,114,.5)}
  .pill.ok{border-color:rgba(143,191,106,.45)}
  .ysub{color:var(--muted);font-size:13px;margin:4px 0 6px}

  /* charts */
  .plot{position:relative}
  .plot svg{width:100%;height:auto;display:block;touch-action:pan-y}
  .plot .grid{stroke:rgba(143,191,163,.15)}
  .plot .ax{fill:#9FB3A8;font-size:12px;font-family:Archivo,sans-serif}
  .plot .lim{stroke:#D98F72;stroke-width:1.4;stroke-dasharray:6 5;opacity:.9}
  .plot .limt{fill:#D98F72;font-size:12px;font-family:Archivo,sans-serif;paint-order:stroke;stroke:#212F29;stroke-width:4px;stroke-linejoin:round}
  .plot .ax.sno{font-size:11px;opacity:.85}
  .plot .guide{stroke:var(--fibre);stroke-width:1;opacity:0}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .legend i.dash{width:16px;height:0;border-radius:0;border-top:2px dashed #D98F72;vertical-align:3px}
  .tip{position:absolute;z-index:4;pointer-events:none;padding:7px 10px;border-radius:9px;background:#101A16;
    border:1px solid var(--fibre);font-size:12.5px;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .08s}
  .tip b{color:var(--fibre)}
  .tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

  /* readings list */
  h2{font-size:19px;margin:22px 0 10px}
  .tools{display:flex;gap:8px;margin:10px 0 6px}
  .tools .btn{flex:1;min-height:40px;font-size:14px}
  .rec{display:flex;align-items:center;gap:12px;background:var(--husk-2);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;margin-bottom:7px}
  .rec .body{flex:1;min-width:0}
  .rec .l1{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec .l1 span{color:var(--muted);font-weight:400;margin-left:4px}
  .rec .l2{color:var(--muted);font-size:12.5px;margin-top:2px}
  .rec .ec{font-family:Fraunces,Georgia,serif;font-size:22px;min-width:52px;text-align:right}
  .rec.over{border-color:rgba(217,143,114,.5)}
  .rec.over .ec{color:var(--bad-soft)}
  .empty{color:var(--muted);font-size:14px;margin:8px 0}

  .loading #main{opacity:.55;transition:opacity .15s}
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;max-width:92vw;
    padding:11px 15px;border-radius:11px;font-size:14px;background:#0E1712;border:1px solid var(--edge);display:none}
  #toast.bad{border-color:rgba(217,143,114,.6);color:#FBE3D9}
  .modal{position:fixed;inset:0;z-index:30;background:rgba(6,11,9,.74);display:flex;align-items:center;justify-content:center;padding:20px}
  .modal .box{width:100%;max-width:330px;background:linear-gradient(180deg,var(--husk-2),#182620);
    border:1px solid var(--edge);border-radius:16px;padding:18px}
  .modal h3{margin:0 0 8px;font-size:18px}
  .modal p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
  .modal input{margin-top:10px}
  .modal .mb{display:flex;gap:10px;margin-top:15px}
  .modal .mb .btn{flex:1}
  .btn.set{border-color:var(--fibre);color:var(--fibre)}
  .lrow{display:flex;align-items:center;gap:10px;margin-top:12px}
  .lrow .lname{flex:1;min-width:0}
  .lrow .lname b{display:block;font-size:15px}
  .lrow .lname small{color:var(--muted);font-size:12px}
  .modal .lrow input{width:110px;margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .modal .alt{width:100%;margin-top:10px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <div class="bar">
    
    <div class="ttl"><b>EC readings</b><span id="rangeLabel">loading…</span></div>
    <button class="btn ghost" id="limitBtn">Limits</button>
    <button class="btn ghost" id="refreshBtn">Refresh</button>
  </div>

  <div class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="hall" aria-selected="true">Machine hall</button>
    <button role="tab" data-tab="yard" aria-selected="false">Yards</button>
  </div>

  <div class="chips" id="rangeChips">
    <button data-range="today" aria-pressed="true">Today</button>
    <button data-range="week" aria-pressed="false">7 days</button>
    <button data-range="month" aria-pressed="false">30 days</button>
    <button data-range="custom" aria-pressed="false">Pick dates</button>
  </div>
  <div class="pair" id="customWrap" hidden>
    <div><label for="dFrom">From</label><input id="dFrom" type="date"></div>
    <div><label for="dTo">To</label><input id="dTo" type="date"></div>
  </div>
  <div class="pair">
    <div><label for="whoSel">Logged by</label><select id="whoSel"><option value="all">Everyone</option></select></div>
    <div id="yardPick" hidden><label for="yardSel">Yard</label><select id="yardSel"><option value="all">All yards</option></select></div>
  </div>

  <div id="main">
    <!-- ============ machine hall ============ -->
    <section id="hall">
      <div class="card">
        <div class="head">
          <div><div class="big" id="hN">—</div><div class="cap">readings</div></div>
          <div><div class="big" id="hOver">—</div><div class="cap">over limit</div></div>
        </div>
        <div class="track"><i id="hBar"></i></div>
        <div class="tiles" id="hTiles"></div>
        <p class="note" id="hLast"></p>
        <p class="note" id="hWho"></p>
      </div>
      <div class="card" id="hChart" hidden></div>
    </section>

    <!-- ============ yards ============ -->
    <section id="yard" hidden>
      <div class="card">
        <div class="head">
          <div><div class="big" id="yN">—</div><div class="cap">readings</div></div>
          <div><div class="big" id="yOver">—</div><div class="cap">over limit</div></div>
        </div>
        <div class="track"><i id="yBar"></i></div>
        <div class="mini">
          <div><b id="yAvg">—</b><span>average</span></div>
          <div><b id="yMax">—</b><span>highest</span></div>
          <div><b id="yLim">—</b><span>limit</span></div>
        </div>
        <p class="note" id="yLast"></p>
        <p class="note" id="yWho"></p>
      </div>
      <div id="yCards"></div>
    </section>

    <!-- ============ readings for the open tab ============ -->
    <h2 id="rTitle">Readings</h2>
    <div class="chips" id="ptChips"></div>
    <input id="rSearch" placeholder="Search sample no, yard, condition or person" autocomplete="off">
    <div class="tools">
      <button class="btn ghost" id="rOver" aria-pressed="false">Only over limit</button>
      <button class="btn ghost" id="rExport">Export to sheet</button>
    </div>
    <p class="note" id="rCount"></p>
    <div id="rList"></div>
  </div>
  <p class="note" style="text-align:center;margin-top:26px">Viewer version 24 Sep G</p>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== optional gate. Set to '' to open with no password. ===== */
var VIEW_PIN = '';
/* ============================================================= */

var TAB = 'hall', RANGE = 'today', WHO = 'all', SPOT = 'all', HALL_PT = 'Hall';
var S = null, REC = null, SPOTS_KNOWN = [], CHARTS = [];
var Q = { text: '', overOnly: false };
var COLOR = { Belt: '#F2C255', Block: '#7FB6D9', avg: '#8FBF6A', high: '#D98CC0' };
var NONE = { n: 0, over: 0, avg: null, max: null };

function $(id){ return document.getElementById(id); }
function each(list, fn){ Array.prototype.forEach.call(list, fn); }
function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(res, rej){
    google.script.run.withSuccessHandler(res)
      .withFailureHandler(function(e){ rej(e && e.message ? e.message : String(e)); })[fn].apply(null, args);
  });
}
function say(m, bad){ var t = $('toast'); t.textContent = m; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(say._t); say._t = setTimeout(function(){ t.style.display = 'none'; }, bad ? 4200 : 2000); }
var busyN = 0;
function busy(on){ busyN = Math.max(0, busyN + (on ? 1 : -1)); document.body.classList.toggle('loading', busyN > 0); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function n2(v){ return (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toFixed(2); }
function dmy(d){ var p = String(d).split('-'); return p.length === 3 ? p[2] + '/' + p[1] : d; }
function todayIso(){
  var d = new Date(), p = function(n){ return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function modal(cfg){
  return new Promise(function(res, rej){
    var back = document.createElement('div'); back.className = 'modal';
    var box = document.createElement('div'); box.className = 'box';
    var h = document.createElement('h3'); h.textContent = cfg.title || ''; box.appendChild(h);
    if (cfg.text){ var p = document.createElement('p'); p.textContent = cfg.text; box.appendChild(p); }
    var inp = null;
    if (cfg.input){ inp = document.createElement('input'); inp.type = cfg.input; box.appendChild(inp); }
    var row = document.createElement('div'); row.className = 'mb';
    var ok = document.createElement('button'); ok.className = 'btn'; ok.textContent = cfg.ok || 'OK';
    row.appendChild(ok);
    if (!cfg.noCancel){ var cx = document.createElement('button'); cx.className = 'btn ghost'; cx.textContent = 'Cancel';
      cx.onclick = function(){ document.body.removeChild(back); rej('cancel'); }; row.appendChild(cx); }
    box.appendChild(row); back.appendChild(box); document.body.appendChild(back);
    ok.onclick = function(){ document.body.removeChild(back); res(inp ? inp.value : true); };
    back.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); ok.click(); } });
    setTimeout(function(){ (inp || ok).focus(); }, 40);
  });
}

/* ---------- what gets sent to the server ---------- */
function base(){ return [RANGE, $('dFrom').value, $('dTo').value, WHO]; }
function summarySpot(){ return TAB === 'yard' ? SPOT : 'all'; }
function recFilters(){
  return { point: TAB === 'hall' ? HALL_PT : 'Yard', spot: TAB === 'yard' ? SPOT : 'all',
           cond: 'all', overOnly: Q.overOnly, text: Q.text };
}

/* ---------- chart: lines + dashed limits, tap to read a day ---------- */
function chart(labels, series, limits, subs){
  var W = 380, H = subs ? 224 : 210, L = 36, R = 10, T = 16, B = subs ? 44 : 30, n = labels.length, top = 0;
  limits.forEach(function(l){ if (l.v > top) top = l.v; });
  series.forEach(function(s){ s.vals.forEach(function(v){ if (v != null && v > top) top = v; }); });
  // tidy axis steps (0.05, 0.1, 0.25 ...) with just enough headroom above the highest value
  var want = (top || 1) * 1.08, steps = [0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 5], stepY = 5;
  for (var si = 0; si < steps.length; si++){ if (want / steps[si] <= 6){ stepY = steps[si]; break; } }
  var nLines = Math.ceil(want / stepY);
  top = stepY * nLines;
  var xs = labels.map(function(_, i){ return L + (n < 2 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)); });
  var py = function(v){ return T + (H - T - B) * (1 - v / top); };
  var o = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  for (var g = 0; g <= nLines; g++){
    var gv = stepY * g, y = py(gv).toFixed(1);
    o += '<line class="grid" x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '"/>' +
         '<text class="ax" x="' + (L - 5) + '" y="' + (Number(y) + 4) + '" text-anchor="end">' + gv.toFixed(2) + '</text>';
  }
  var step = Math.max(1, Math.ceil(n / 6));
  labels.forEach(function(x, i){
    if (i % step) return;
    var anchor = xs[i] > W - R - 20 ? 'end' : 'middle';   // keep the last date inside the frame
    o += '<text class="ax" x="' + xs[i].toFixed(1) + '" y="' + (H - B + 18) + '" text-anchor="' + anchor + '">' + esc(String(x).split(' ')[0]) + '</text>';   // date only on multi-day, time on one day
    if (subs && subs[i] != null && subs[i] !== '')
      o += '<text class="ax sno" x="' + xs[i].toFixed(1) + '" y="' + (H - B + 33) + '" text-anchor="' + anchor + '">#' + esc(subs[i]) + '</text>';
  });
  var limLabels = '';   // drawn last so the dots never hide them
  limits.forEach(function(l){
    var y = py(l.v).toFixed(1);
    o += '<line class="lim" x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '"/>';
    limLabels += '<text class="limt" x="' + (W - R) + '" y="' + (Number(y) - 5) + '" text-anchor="end">' + esc(l.name) + ' ' + l.v.toFixed(2) + '</text>';
  });
  o += '<line class="guide" x1="0" y1="' + T + '" x2="0" y2="' + (H - B) + '"/>';
  series.forEach(function(s){
    var d = '', open = false, dots = '';
    s.vals.forEach(function(v, i){
      if (v == null){ if (!s.join) open = false; return; }
      var x = xs[i].toFixed(1), y = py(v).toFixed(1);
      d += (open ? ' L ' : ' M ') + x + ' ' + y; open = true;
      dots += '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="' + s.color + '" data-i="' + i + '"/>';
    });
    if (d) o += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.2" stroke-linejoin="round"/>';
    o += dots;
  });
  o += limLabels + '</svg>';
  var k = CHARTS.push({ W: W, xs: xs, labels: labels, series: series, subs: subs }) - 1;
  var lg = '<div class="legend">' + series.map(function(s){
    return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>'; }).join('') +
    '<span><i class="dash"></i>Limit</span></div>';
  return '<div class="plot" data-chart="' + k + '">' + o + lg + '</div>';
}

function wireCharts(root){
  each(root.querySelectorAll('.plot'), function(box){
    var spec = CHARTS[Number(box.getAttribute('data-chart'))], svg = box.querySelector('svg');
    if (!spec || !svg) return;
    var tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip);
    var guide = svg.querySelector('.guide'), dots = svg.querySelectorAll('circle'), timer = null;
    function mark(i){ each(dots, function(c){ c.setAttribute('r', c.getAttribute('data-i') === String(i) ? '6' : '3.5'); }); }
    function hide(){ tip.style.opacity = 0; guide.style.opacity = 0; mark(-1); }
    function show(clientX){
      var b = svg.getBoundingClientRect(), bb = box.getBoundingClientRect();
      var x = (clientX - b.left) / b.width * spec.W, best = -1, bd = 1e9;
      spec.xs.forEach(function(px, i){
        var has = spec.series.some(function(s){ return s.vals[i] != null; });
        if (has && Math.abs(px - x) < bd){ bd = Math.abs(px - x); best = i; }
      });
      if (best < 0) return hide();
      var html = '<b>' + esc(spec.labels[best]) + (spec.subs && spec.subs[best] ? ', sample #' + esc(spec.subs[best]) : '') + '</b>';
      spec.series.forEach(function(s){
        var v = s.vals[best];
        if (v != null) html += '<br><i style="background:' + s.color + '"></i>' + esc(s.name) + ' ' + v.toFixed(2);
      });
      tip.innerHTML = html; tip.style.opacity = 1;
      var cx = b.left - bb.left + spec.xs[best] / spec.W * b.width;
      tip.style.left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), box.clientWidth - tip.offsetWidth) + 'px';
      tip.style.top = (b.top - bb.top + 2) + 'px';
      guide.setAttribute('x1', spec.xs[best]); guide.setAttribute('x2', spec.xs[best]); guide.style.opacity = .55;
      mark(best);
    }
    svg.addEventListener('pointerdown', function(e){ clearTimeout(timer); show(e.clientX); });
    svg.addEventListener('pointermove', function(e){ if (e.pointerType === 'mouse' || e.buttons) show(e.clientX); });
    svg.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse') hide(); });
    svg.addEventListener('pointerup', function(e){ if (e.pointerType !== 'mouse'){ clearTimeout(timer); timer = setTimeout(hide, 2500); } });
  });
}

/* ---------- shared bits ---------- */
function headline(p, n, over){
  $(p + 'N').textContent = n;
  $(p + 'Over').textContent = over;
  $(p + 'Over').classList.toggle('warn', over > 0);
  $(p + 'Bar').style.width = (n ? Math.round(over / n * 100) : 0) + '%';
}
function lastText(l){
  if (!l) return 'Nothing logged in this range.';
  var where = l.point === 'Yard' ? l.spot : l.point;
  var when = (S.from === S.to ? '' : dmy(l.date) + ' ') + (l.hhmm || '');
  return 'Last reading: ' + where + ' ' + n2(l.ec) + (l.over ? ' (over)' : '') + (when ? ' at ' + when : '') + ', by ' + l.op;
}
function whoText(map){
  var names = Object.keys(map || {});
  if (!names.length) return '';
  names.sort(function(a, b){ return map[b].n - map[a].n; });
  return 'Logged by ' + names.map(function(p){
    var d = map[p];
    return esc(p) + ' ' + d.n + (d.over ? ' <span class="flag">(' + d.over + ' over)</span>' : '');
  }).join(', ');
}
function tile(name, d, limit, color){
  return '<div class="tile" style="--c:' + color + '">' +
    '<div class="t">' + name + '<span>limit ' + n2(limit) + '</span></div>' +
    '<div class="v">' + n2(d.avg) + '<small>avg</small></div>' +
    '<div class="s">' + d.n + ' taken, <span class="' + (d.over ? 'flag' : 'ok') + '">' + d.over + ' over</span></div>' +
    '<div class="s">highest ' + n2(d.max) + '</div></div>';
}
/* Every reading in the range, oldest first. */
function readingsIn(keep){ return (S.points || []).filter(keep); }
/* Time of each reading; the date is added when the range covers more than one day. */
function timeLabels(pts){
  var multi = S.from !== S.to;
  return pts.map(function(r){ return (multi ? dmy(r.date) + ' ' : '') + (r.hhmm || ''); });
}
function emptyNote(n, what){
  return '<p class="note" style="margin:0 0 6px">' + (n
    ? 'Too many readings to draw in this range. Pick a shorter range.'
    : 'No ' + what + ' readings in this range yet.') + '</p>';
}
function oneDayNote(what){
  return '<p class="note">Only one day in this range. Pick 7 or 30 days to see ' + what + '.</p>';
}

/* ---------- machine hall: Belt + Block ---------- */
function drawHall(){
  var belt = S.byPoint.Belt || NONE, block = S.byPoint.Block || NONE, lim = S.limits;
  var n = belt.n + block.n;
  headline('h', n, belt.over + block.over);
  $('hTiles').innerHTML = tile('Belt', belt, lim.Belt, COLOR.Belt) + tile('Block', block, lim.Block, COLOR.Block);
  $('hLast').textContent = lastText(S.lastBy && S.lastBy.Hall);
  $('hWho').innerHTML = whoText(S.byPersonGroup && S.byPersonGroup.Hall);

  var box = $('hChart');
  box.hidden = false;
  var hallLimits = [ { name: 'Belt limit', v: lim.Belt }, { name: 'Block limit', v: lim.Block } ];
  var pts = readingsIn(function(r){ return r.point === 'Belt' || r.point === 'Block'; });
  var html = '<h3>Belt and Block, every reading</h3>';
  if (!pts.length) html += emptyNote(n, 'Belt or Block');
  html += chart(pts.length ? timeLabels(pts) : [dmy(S.to)], [
      { name: 'Belt',  color: COLOR.Belt,  join: true, vals: pts.map(function(r){ return r.point === 'Belt'  ? r.ec : null; }) },
      { name: 'Block', color: COLOR.Block, join: true, vals: pts.map(function(r){ return r.point === 'Block' ? r.ec : null; }) }
    ], hallLimits, pts.length ? pts.map(function(r){ return r.sno; }) : null);
  box.innerHTML = html;
  wireCharts(box);
}

/* ---------- yards: one card and one graph per yard ---------- */
function drawYard(){
  var y = S.byPoint.Yard || NONE, lim = S.limits.Yard;
  headline('y', y.n, y.over);
  $('yAvg').textContent = n2(y.avg);
  $('yMax').textContent = n2(y.max);
  $('yLim').textContent = n2(lim);
  $('yLast').textContent = lastText(S.lastBy && S.lastBy.Yard);
  $('yWho').innerHTML = whoText(S.byPersonGroup && S.byPersonGroup.Yard);

  var spots = Object.keys(S.bySpot).sort(function(a, b){
    var A = S.bySpot[a], B = S.bySpot[b];
    return (B.over / B.n) - (A.over / A.n) || B.n - A.n;
  });
  var html = '';
  if (!spots.length){
    html = '<div class="card"><h3>Yards</h3><p class="note" style="margin:0 0 6px">No yard readings in this range yet.</p>' +
      chart([dmy(S.to)], [ { name: 'Reading', color: COLOR.avg, vals: [null] } ], [ { name: 'Limit', v: lim } ]) + '</div>';
  }

  spots.forEach(function(s){
    var d = S.bySpot[s], pct = d.n ? Math.round(d.over / d.n * 100) : 0;
    html += '<div class="card"><div class="yhead"><h3>' + esc(s) + '</h3>' +
      '<span class="pill ' + (d.over ? 'flag' : 'ok') + '">' + (d.over ? pct + '% over' : 'all within limit') + '</span></div>' +
      '<div class="ysub">' + d.n + ' reading' + (d.n === 1 ? '' : 's') + ', average ' + n2(d.avg) + ', highest ' + n2(d.max) + '</div>';
    var yp = readingsIn(function(r){ return r.point === 'Yard' && r.spot === s; });
    if (!yp.length) html += emptyNote(d.n, 'yard');
    html += chart(yp.length ? timeLabels(yp) : [dmy(S.to)], [
      { name: 'Reading', color: COLOR.avg, join: true, vals: yp.map(function(r){ return r.ec; }) }
    ], [ { name: 'Limit', v: lim } ], yp.length ? yp.map(function(r){ return r.sno; }) : null);
    html += '</div>';
  });
  $('yCards').innerHTML = html;
  wireCharts($('yCards'));
}

function drawTab(){
  if (!S) return;
  CHARTS = [];
  if (TAB === 'hall') drawHall(); else drawYard();
}

/* ---------- readings list for the open tab ---------- */
function drawRecords(){
  $('rTitle').textContent = TAB === 'hall' ? 'Machine hall readings' : (SPOT === 'all' ? 'Yard readings' : SPOT + ' readings');
  var pc = $('ptChips');
  pc.hidden = TAB !== 'hall';
  pc.innerHTML = [['Hall', 'Belt and Block'], ['Belt', 'Belt'], ['Block', 'Block']].map(function(p){
    return '<button data-pt="' + p[0] + '" aria-pressed="' + (HALL_PT === p[0]) + '">' + p[1] + '</button>';
  }).join('');
  var ob = $('rOver');
  ob.setAttribute('aria-pressed', Q.overOnly ? 'true' : 'false');
  ob.className = 'btn ' + (Q.overOnly ? 'on' : 'ghost');

  var box = $('rList'), cnt = $('rCount');
  if (!REC){ box.innerHTML = '<p class="empty">Loading…</p>'; cnt.textContent = ''; return; }
  if (!REC.rows.length){
    box.innerHTML = '<p class="empty">No readings match. Try a wider date range, or clear the search and the over-limit filter.</p>';
    cnt.textContent = ''; return;
  }
  cnt.textContent = REC.capped
    ? 'Showing the newest ' + REC.rows.length + ' of ' + REC.total + '. Narrow the dates or search to see the rest.'
    : REC.total + ' reading' + (REC.total === 1 ? '' : 's') + ', newest first';
  box.innerHTML = REC.rows.map(function(r){
    var where = r.point === 'Yard' ? r.spot : r.point;
    var bits = [dmy(r.date) + ' ' + r.hhmm];
    if (r.cond) bits.push(r.cond);
    bits.push(r.op);
    return '<div class="rec' + (r.over ? ' over' : '') + '"><div class="body">' +
      '<div class="l1">' + esc(where) + '<span>#' + esc(r.sno) + '</span></div>' +
      '<div class="l2">' + esc(bits.join(', ')) + '</div></div>' +
      '<div class="ec">' + n2(r.ec) + '</div></div>';
  }).join('');
}

/* ---------- pickers ---------- */
function fillSelect(sel, first, list, current){
  if (current !== 'all' && list.indexOf(current) < 0) list = list.concat([current]);
  sel.innerHTML = '<option value="all">' + first + '</option>' + list.map(function(v){
    return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('');
  sel.value = current;
}
function drawSelects(){
  fillSelect($('whoSel'), 'Everyone', (S && S.people) || [], WHO);
  fillSelect($('yardSel'), 'All yards', (S && S.spotsAll && S.spotsAll.length) ? S.spotsAll : SPOTS_KNOWN, SPOT);
}
function drawHeader(){
  var lb = $('limitBtn');
  lb.classList.toggle('set', !!S.limitsSaved);
  lb.textContent = S.limitsSaved ? 'Limits (yours)' : 'Limits';
  $('rangeLabel').textContent = (S.from === S.to ? dmy(S.from) : dmy(S.from) + ' to ' + dmy(S.to)) +
    (WHO === 'all' ? ', everyone' : ', ' + WHO);
}

/* ---------- loading ---------- */
var sumSeq = 0, recSeq = 0;
function loadSummary(){
  var my = ++sumSeq, shown = false; busy(true);
  return FCP.cached('api_summary', base().concat([summarySpot()]), function(s){
    if (my !== sumSeq) return;
    if (!shown){ shown = true; busy(false); }
    S = s; drawHeader(); drawSelects(); drawTab();
  }).then(function(){ if (!shown) busy(false); }, function(e){
    if (!shown) busy(false);
    if (!e.hadSaved && !e.stale) say(e.message, true);
  });
}
function loadRecords(){
  var my = ++recSeq, shown = false; busy(true);
  return FCP.cached('api_records', base().concat([recFilters()]), function(r){
    if (my !== recSeq) return;
    if (!shown){ shown = true; busy(false); }
    REC = r; drawRecords();
  }).then(function(){ if (!shown) busy(false); }, function(e){
    if (!shown) busy(false);
    if (!e.hadSaved && !e.stale) say(e.message, true);
  });
}
function reloadRecords(){ REC = null; drawRecords(); loadRecords(); }
function loadAll(){ loadSummary(); reloadRecords(); }

/* ---------- wiring ---------- */
$('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  var t = b.getAttribute('data-tab'); if (t === TAB) return;
  TAB = t;
  each(this.querySelectorAll('button'), function(x){ x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
  $('hall').hidden = TAB !== 'hall';
  $('yard').hidden = TAB !== 'yard';
  $('yardPick').hidden = TAB !== 'yard';
  // a yard filter only narrows the Yards tab, so re-read when it would change the numbers
  if (!S || S.spot !== summarySpot()) loadSummary(); else drawTab();
  reloadRecords();
});
$('rangeChips').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  RANGE = b.getAttribute('data-range');
  each(this.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  $('customWrap').hidden = RANGE !== 'custom';
  if (RANGE === 'custom'){
    // start from whatever is on screen, so picking one date is enough
    if (!$('dFrom').value) $('dFrom').value = S ? S.from : todayIso();
    if (!$('dTo').value)   $('dTo').value   = S ? S.to   : todayIso();
  }
  loadAll();
});
$('dFrom').onchange = $('dTo').onchange = function(){ if (RANGE === 'custom') loadAll(); };
$('whoSel').onchange = function(){ WHO = this.value; loadAll(); };
$('yardSel').onchange = function(){ SPOT = this.value; loadAll(); };
$('ptChips').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  HALL_PT = b.getAttribute('data-pt'); reloadRecords();
});
$('rOver').onclick = function(){ Q.overOnly = !Q.overOnly; reloadRecords(); };
var searchTimer = null;
$('rSearch').oninput = function(){
  Q.text = this.value.trim(); clearTimeout(searchTimer);
  searchTimer = setTimeout(loadRecords, 450);
};
$('rExport').onclick = function(){
  var btn = this; btn.disabled = true; busy(true);
  call.apply(null, ['api_export'].concat(base(), [recFilters()])).then(function(r){
    busy(false); btn.disabled = false;
    modal({ title: 'Exported ' + r.rows + ' rows', text: 'Written to the "Export view" tab of the sheet.', ok: 'Open the sheet' })
      .then(function(){ window.open(r.url, '_blank'); }).catch(function(){});
  }).catch(function(e){ busy(false); btn.disabled = false; say(e, true); });
};
$('refreshBtn').onclick = function(){
  var btn = this; btn.disabled = true; busy(true);
  call('api_refresh').then(function(){ FCP.forget(); busy(false); btn.disabled = false; say('Re-read from the sheet.'); loadAll(); })
    .catch(function(e){ busy(false); btn.disabled = false; say(e, true); });
};

/* ---------- change limits ---------- */
function limitDialog(){
  if (!S) return;
  var sheet = S.sheetLimits || S.limits, now = S.limits;
  var back = document.createElement('div'); back.className = 'modal';
  var box = document.createElement('div'); box.className = 'box'; back.appendChild(box);
  box.innerHTML = '<h3>Change limits</h3>' +
    '<p>Used for the graphs, the over-limit counts, the readings list and the export. ' +
    'The EC Log app keeps its own limits.</p>' +
    ['Belt', 'Block', 'Yard'].map(function(k){
      return '<div class="lrow"><div class="lname"><b>' + k + '</b><small>sheet says ' + n2(sheet[k]) + '</small></div>' +
        '<input type="number" inputmode="decimal" step="0.01" min="0.01" max="20" data-k="' + k + '" value="' + n2(now[k]) + '"></div>';
    }).join('') +
    '<div class="mb"><button class="btn" data-a="save">Save limits</button><button class="btn ghost" data-a="cancel">Cancel</button></div>' +
    (S.limitsSaved ? '<button class="btn ghost alt" data-a="reset">Go back to the sheet limits</button>' : '');
  document.body.appendChild(back);
  function close(){ if (back.parentNode) document.body.removeChild(back); }
  function done(msg){ close(); say(msg); loadAll(); }
  box.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cancel') return close();
    b.disabled = true;
    if (a === 'reset'){
      call('api_clearLimits').then(function(){ done('Back to the sheet limits.'); })
        .catch(function(err){ b.disabled = false; say(err, true); });
      return;
    }
    var lim = {};
    each(box.querySelectorAll('input[data-k]'), function(i){ lim[i.getAttribute('data-k')] = i.value.trim(); });
    call('api_setLimits', lim).then(function(){ done('Limits saved.'); })
      .catch(function(err){ b.disabled = false; say(err, true); });
  });
  back.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  setTimeout(function(){ box.querySelector('input').focus(); }, 40);
}
$('limitBtn').onclick = limitDialog;

/* ---------- start ---------- */
(function(){
  function go(){
    FCP.cached('api_spots', [], function(list){ SPOTS_KNOWN = list || []; if (!S) drawSelects(); }).catch(function(){});
    loadAll();
  }
  if (!VIEW_PIN) return go();
  (function ask(){
    modal({ title: 'FCP EC readings', text: 'Enter the password to view.', input: 'password', ok: 'Open', noCancel: true })
      .then(function(pin){
        if (String(pin) === VIEW_PIN) go();
        else { say('Wrong password.', true); ask(); }
      });
  })();
})();
</script>
</body>
